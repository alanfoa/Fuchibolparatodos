        html,

        }

        :root {

        }

        .jw-button-container .jw-icon {

        }

        }

        .jw-featured,
        .jw-rightclick {
            display: none !important;
        }

        /* ── PANTALLA DE CARGA ── */
        #loader {
            position: fixed;
            inset: 0;
            background: #0d0d0d;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        #loader.oculto {
            opacity: 0;
            pointer-events: none;
        }

        /* Spinner de tres arcos */
        .spinner {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 4px solid rgba(81, 224, 192, 0.15);
            border-top-color: var(--colorbarra);
            border-right-color: var(--colorbarra);
            animation: girar 0.9s linear infinite;
        }

        @keyframes girar {
            to {
                transform: rotate(360deg);
            }
        }

        .loader-texto {
            color: #aaa;
            font-family: system-ui, sans-serif;
            font-size: 14px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .loader-texto span {
            color: var(--colorbarra);
        }

        /* Barra de progreso indeterminada */
        .barra-wrap {
            width: 180px;
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 99px;
            overflow: hidden;
        }

        .barra-inner {
            height: 100%;
            width: 45%;
            background: var(--colorbarra);
            border-radius: 99px;
            animation: deslizar 1.4s ease-in-out infinite;
        }

        @keyframes deslizar {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(280%);
            }
        }
    </style>

        function ocultarLoader() {
            const loader = document.getElementById('loader');
            loader.classList.add('oculto');
            // Lo removemos del DOM después de la transición
            setTimeout(() => loader.remove(), 500);
        }

        if (!getURL) {
            alert("Parámetro 'stream' vacío o erróneo");
            ocultarLoader();
        } else {
            window.onload = iniciarReproductor;
        }

        async function obtener() {
            try {
                const response = await fetch(
                    'https://proxy-videx.canalesonline24.workers.dev/?url=' +
                    encodeURIComponent(getURL)
                );

                const html = await response.text();

                const doc = new DOMParser().parseFromString(html, "text/html");
                const player = doc.querySelector(".js-player-init");

                if (!player) {
                    console.error("❌ No se encontró .js-player-init");
                    ocultarLoader();
                    return null;
                }

                const data = player.dataset.src || player.dataset.backup;

                if (!data) {
                    console.error("❌ No existe data-src ni data-backup");
                    ocultarLoader();
                    return null;
                }

                const m3u8 = atob(data);

                console.log("M3U8:", m3u8);

                return m3u8;

            } catch (error) {
                console.error(error);
                ocultarLoader();
                return null;
            }
        }

        async function iniciarReproductor() {
            const playbackURL = await obtener();
            if (playbackURL) {
                jwplayer("player").setup({
                    file: playbackURL,
                    width: "100%",
                    height: "100%",
                    autostart: true,
                    mute: false,
                    cast: {},
                    sharing: {},
                    displaytitle: true,
                    stretching: "uniform",
                    preload: "auto",
                    liveSyncDuration: 3,
                });

                // Se quita SOLO cuando el canal está reproduciendo de verdad
                jwplayer("player").on("firstFrame", ocultarLoader);
                jwplayer("player").on("time", function handler() {
                    ocultarLoader();
                    jwplayer("player").off("time", handler); // se auto-desuscribe
                });
            }
        }
