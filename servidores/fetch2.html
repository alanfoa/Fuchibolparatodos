<!DOCTYPE html>

    <style>
        html,
        body {
            width: 100% !important;
            height: 100% !important;
            margin: 0;
            padding: 0;
            background: #000;
        }

        :root {
            --colorbarra: #51E0C0;
            --coloriconos: #f0f0f0;
        }

        .jw-button-container .jw-icon {
            color: var(--coloriconos) !important;
        }

        .jw-slider-container .jw-progress {
            background-color: var(--colorbarra) !important;
        }

        .jw-icon:hover {
            color: var(--colorbarra) !important;
        }

        .jw-featured,
        .jw-rightclick {
            display: none !important;
        }

        /* ── PANTALLA DE CARGA ── */
        #loader {
            position: fixed;
            inset: 0;
            background: #0d0d0d;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        #loader.oculto {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 4px solid rgba(81, 224, 192, 0.15);
            border-top-color: var(--colorbarra);
            border-right-color: var(--colorbarra);
            animation: girar 0.9s linear infinite;
        }

        @keyframes girar {
            to {
                transform: rotate(360deg);
            }
        }

        .loader-texto {
            color: #aaa;
            font-family: system-ui, sans-serif;
            font-size: 14px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .loader-texto span {
            color: var(--colorbarra);
        }

        .barra-wrap {
            width: 180px;
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 99px;
            overflow: hidden;
        }

        .barra-inner {
            height: 100%;
            width: 45%;
            background: var(--colorbarra);
            border-radius: 99px;
            animation: deslizar 1.4s ease-in-out infinite;
        }

        @keyframes deslizar {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(280%);
            }
        }
    </style>
    <link rel="stylesheet" href="style-jw.css">
</head>

<body>

    <!-- Pantalla de carga -->
    <div id="loader">
        <div class="spinner"></div>
        <div class="loader-texto">Cargando <span>señal</span>...</div>
        <div class="barra-wrap">
            <div class="barra-inner"></div>
        </div>
    </div>

    <div id="player"></div>

    <script src="../js/script-config.js"></script>
    <script>

        function ocultarLoader() {
            const loader = document.getElementById('loader');

            for (const proxyURL of proxies) {

            }

        }


        cargarm3u8().then(result => {
            if (result && result.m3u8) {
                jwplayer("player").setup({
                    file: result.m3u8,
                    width: "100%",
                    height: "100%",
                    autostart: true,
                    mute: false,
                    cast: {},
                    sharing: {},
                    displaytitle: true,
                    stretching: "uniform",
                    preload: "auto",
                    liveSyncDuration: 3,
                });

                // Se oculta cuando hay reproducción real
                jwplayer("player").on("firstFrame", ocultarLoader);

                jwplayer("player").on("time", function handler() {
                    ocultarLoader();
                    jwplayer("player").off("time", handler);
                });

            } else {
                ocultarLoader();
                alert("No se pudo obtener el stream.");
