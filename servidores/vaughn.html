<!DOCTYPE html>
<html lang="es">

<!-- https://vaughn.live/browse/espanol -->

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vaughn</title>
    <!-- Favicon -->
    <link rel="shortcut icon" href="../img/icono.webp" type="image/x-icon">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flv.js/1.6.2/flv.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script> <!-- hls.js -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <!-- <script src="https://canalesonline.netlify.app/js/script-config.js"></script> -->

    <script src="../js/script-config.js"></script>

    <style>
        :root {
            --colorbarra: #51E0C0;
            --coloriconos: #f0f0f0;
        }


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: black;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .player-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: black;
        }

        video {
            width: 100%;
            height: 100%;
            /* object-fit: cover; */
        }

        .controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 10px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.6), transparent);
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 1;
            transition: opacity 0.3s;
            z-index: 10;
        }

        .controls.hidden {
            opacity: 0;
            pointer-events: none;
        }

        button,
        input[type="range"] {
            background: none;
            border: none;
            color: var(--coloriconos);
            accent-color: var(--coloriconos);
            cursor: pointer;
        }

        .play-btn:hover,
        .volume-icon:hover,
        .rewind-btn:hover,
        .live-button:hover,
        .fullscreen-btn:hover,
        input[type="range"]:hover {
            color: var(--colorbarra);
            accent-color: var(--colorbarra);
            /* accent-color: var(--colorbarra); */
            /* border-color: var(--colorbarra); */
        }

        .play-btn,
        .volume-icon,
        .rewind-btn {
            font-size: 30px;
        }

        .fullscreen-btn {
            font-size: 20px;
            position: absolute;
            right: 10px;
            /* top: 10px; */
        }

        #progress {
            flex: 1;
            height: 5px;
            appearance: none;
            background: #555;
            border-radius: 5px;
            opacity: 0;
            display: none;
        }

        #progress::-webkit-slider-thumb {
            appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: var(--coloriconos);
            cursor: pointer;
        }

        #volume {
            width: 80px;
        }

        .live-button {
            font-size: 13px;
            font-weight: bold;
            opacity: 0.85;
            color: var(--coloriconos);
        }

        .live-button.delayed {
            text-decoration: underline;
            cursor: pointer;
        }

        .volume-control {
            position: relative;
            display: flex;
            align-items: center;
        }

        /* #volume {
            width: 80px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .volume-control:hover #volume,
        .volume-control:focus-within #volume {
            opacity: 1;
            pointer-events: auto;
        } */

        #volume {
            width: 80px;
            display: none;
        }

        .volume-control:hover #volume,
        .volume-control:focus-within #volume {
            display: inline-block;
        }

        .rewind-btn {
            color: var(--coloriconos);
            background: none;
            border: none;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .rewind-btn:hover {
            opacity: 0.7;
        }
    </style>
</head>

<body>
    <div class="player-container">
        <video id="flvPlayer" autoplay></video>

        <!-- Controles personalizados -->
        <div class="controls btn-group" id="customControls">
            <button id="playBtn" class="play-btn" title="Reproducir / Pausar"><i class="bi bi-pause-fill"></i></button>
            <!-- <button id="rewindBtn" class="rewind-btn" title="Retroceder 10 segundos"><i class="bi bi-skip-backward-fill"></i></button> -->
            <div class="volume-control" title="Control de volumen">
                <button id="muteBtn" class="volume-icon" title="Silenciar / Activar sonido"><i
                        class="bi bi-volume-up-fill"></i></button>
                <input type="range" id="volume" min="0" max="1" step="0.01" title="Volumen" />
            </div>
            <button id="liveStatus" class="live-button" title="Estado de transmisión"><i class="bi bi-record-fill"></i>
                EN VIVO</button>
            <input type="range" id="progress" value="0" min="0" step="0.01" title="Barra de progreso" />
            <button id="fullscreenBtn" class="fullscreen-btn" title="Pantalla completa"><i
                    class="bi bi-fullscreen"></i></button>
        </div>
    </div>

    <script>
        if (flvjs.isSupported()) {
            // console.log(mp4StreamUrl);

            let url = new URL(window.location.href);
            const stream = url.searchParams.get('stream');


            const streamUrls = {
                "Neflix": "https://stream-cdn-iad3.vaughnsoft.net/play/live_a_neflix01.flv",
                "Simpson": "https://stream-cdn-iad3.vaughnsoft.net/play/live_simpson_maniahd193.flv",
                // "Beto": "https://stream-cdn-iad3.vaughnsoft.net/play/live_beto_7hd.flv",
                "Terror_mania": "https://stream-cdn-iad3.vaughnsoft.net/play/live_terror_mania.flv",
                "Cienciaficcion1": "https://stream-cdn-iad3.vaughnsoft.net/play/live_cienciaficcion01.flv",
                "Peliculas_mania": "https://stream-cdn-iad3.vaughnsoft.net/play/live_peliculas_mania.flv",
                // "Zonafilmstv": "https://stream-cdn-iad3.vaughnsoft.net/play/live_zonafilmstv.flv",
                "Futurama_mania": "https://stream-cdn-iad3.vaughnsoft.net/play/live_futurama_mania_.flv",
                // "Cienciaficcion2": "https://stream-cdn-iad3.vaughnsoft.net/play/live_cienciaficcion.flv",
                // "Criticando_pelis": "https://stream-cdn-iad3.vaughnsoft.net/play/live_criticando_pelis3.flv",
                "Ganja_tv": "https://stream-cdn-iad3.vaughnsoft.net/play/live_ganja_tv.flv",
                // "Juancine_tv": "https://stream-cdn-iad3.vaughnsoft.net/play/live_juancine_tv.flv",
                "Goku_tv": "https://stream-cdn-iad3.vaughnsoft.net/play/live_goku_tv_oficial.flv",
                // "Shy_ch_anaeter": "https://stream-cdn-iad3.vaughnsoft.net/play/live_shy_ch_anaeter.flv",
                "Angeline": "https://stream-cdn-iad3.vaughnsoft.net/play/live_angeline.flv",
                // "Shy_ch_aariah": "https://stream-cdn-iad3.vaughnsoft.net/play/live_shy_ch_aariah.flv",
                "Tufortunatv": "https://stream-cdn-iad3.vaughnsoft.net/play/live_tufortunatv.flv",
                // "Shy_ch_eurydice": "https://stream-cdn-iad3.vaughnsoft.net/play/live_shy_ch_eurydice.flv",
                // "Seriesan": "https://stream-cdn-iad3.vaughnsoft.net/play/live_seriesan342.flv",
                // "Zonastereo": "https://stream-cdn-iad3.vaughnsoft.net/play/live_zonastereo.flv",
                // "Djtv": "https://stream-cdn-iad3.vaughnsoft.net/play/live_djtv.flv",
                // "Shy_ch_myrto": "https://stream-cdn-iad3.vaughnsoft.net/play/live_shy_ch_myrto.flv",
                // "Xt_bot": "https://stream-cdn-iad3.vaughnsoft.net/play/live_xt_bot.flv",
                // "Telemundial": "https://stream-cdn-iad3.vaughnsoft.net/play/live_11telemundial.flv",
                "Telefe": "https://stream-cdn-iad3.vaughnsoft.net/play/live_11telemundial.flv",
                "Chinchatv": "https://stream-cdn-iad3.vaughnsoft.net/play/live_chinchatv.flv",
                "Drmedia": "https://stream-cdn-iad3.vaughnsoft.net/play/live_drmedia.flv",
                "Mangondelicioso": "https://stream-cdn-iad3.vaughnsoft.net/play/live_mangondelicioso.flv",
                "Telecine": "https://stream-cdn-iad3.vaughnsoft.net/play/live_telecine.flv",
                // "Ganja_tv_2": "https://stream-cdn-iad3.vaughnsoft.net/play/live_ganja_tv_2.flv",
                // "Alhdams": "https://stream-cdn-iad3.vaughnsoft.net/play/live_alhdams.flv",
                // "Barracas": "https://stream-cdn-iad3.vaughnsoft.net/play/live_barracas.flv",
                // "Televisionomega": "https://stream-cdn-iad3.vaughnsoft.net/play/live_televisionomega.flv",
                // "TVsalvision": "https://stream-cdn-iad3.vaughnsoft.net/play/live_tvsalvision.flv",
                "Sintonia": "https://stream-cdn-iad3.vaughnsoft.net/play/live_sintonia.flv",
                // "Telezeta": "https://stream-cdn-iad3.vaughnsoft.net/play/live_telezeta.flv",
                // "Vozdelcielotv": "https://stream-cdn-iad3.vaughnsoft.net/play/live_vozdelcielotv.flv",
                // "Fanatic": "https://stream-cdn-iad3.vaughnsoft.net/play/live_fanatichd29.flv"
            };

            const getURL = streamUrls[stream];

            if (!getURL) alert("Parámetro 'stream' vacío o erróneo");


            const video = document.getElementById("flvPlayer");
            const playBtn = document.getElementById("playBtn");
            const progress = document.getElementById("progress");
            const volume = document.getElementById("volume");
            const fullscreenBtn = document.getElementById("fullscreenBtn");
            const liveStatus = document.getElementById("liveStatus");
            const controls = document.getElementById("customControls");
            // const rewindBtn = document.getElementById("rewindBtn");

            // rewindBtn.addEventListener("click", () => {
            //     video.currentTime = Math.max(0, video.currentTime - 10);
            // });

            if (getURL.endsWith(".m3u8") && Hls.isSupported()) {
                // Si el enlace es m3u8, usar hls.js para cargar y reproducir
                const hls = new Hls();
                hls.loadSource(getURL);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function () {
                    video.play();
                });
            } else if (flvjs.isSupported()) {
                // Si el enlace es FLV, usar flv.js para cargar y reproducir
                const flvPlayer = flvjs.createPlayer({
                    type: "flv",
                    url: getURL
                });
                flvPlayer.attachMediaElement(video);
                flvPlayer.load();
                flvPlayer.play();
            } else {
                alert("Tu navegador no soporta este formato de video.");
            }

            // const flvPlayer = flvjs.createPlayer({
            //     type: "flv",
            //     url: getURL,
            // });

            // flvPlayer.attachMediaElement(video);
            // flvPlayer.load();
            // flvPlayer.play();

            // Play / Pause
            playBtn.addEventListener("click", () => {
                if (video.paused) {
                    video.play();
                    playBtn.innerHTML = '<i class="bi bi-pause-fill"></i>';
                } else {
                    video.pause();
                    playBtn.innerHTML = '<i class="bi bi-play-fill"></i>';
                }
            });

            // Hacer clic en el video pausa / reproduce
            video.addEventListener("click", () => {
                if (video.paused) {
                    video.play();
                    playBtn.innerHTML = '<i class="bi bi-pause-fill"></i>';
                } else {
                    video.pause();
                    playBtn.innerHTML = '<i class="bi bi-play-fill"></i>';
                }
            });

            // Volumen
            video.volume = 1;
            volume.value = 1;
            volume.addEventListener("input", () => {
                video.volume = volume.value;
            });

            // Mute / Unmute al hacer clic en el ícono
            const muteBtn = document.getElementById("muteBtn");

            // Mute / Unmute
            muteBtn.addEventListener("click", () => {
                video.muted = !video.muted;
                muteBtn.innerHTML = video.muted
                    ? '<i class="bi bi-volume-mute-fill"></i>'
                    : '<i class="bi bi-volume-up-fill"></i>';
            });

            // Actualiza el ícono si se cambia desde el slider también
            volume.addEventListener("input", () => {
                video.volume = volume.value;
                if (video.volume == 0) {
                    video.muted = true;
                } else {
                    video.muted = false;
                }
                muteBtn.innerHTML = video.muted
                    ? '<i class="bi bi-volume-mute-fill"></i>'
                    : '<i class="bi bi-volume-up-fill"></i>';
            });


            // Pantalla completa
            fullscreenBtn.addEventListener("click", () => {
                if (!document.fullscreenElement) {
                    video.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            });

            // Barra de progreso
            video.addEventListener("timeupdate", () => {
                progress.max = video.duration || 1;
                progress.value = video.currentTime;
            });

            progress.addEventListener("input", () => {
                video.currentTime = progress.value;
            });

            // EN VIVO
            function formatTime(seconds) {
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
            }

            // function updateLiveStatus() {
            //     const delay = flvPlayer.buffered.end(0) - video.currentTime;
            //     if (delay < 2) {
            //         liveStatus.innerHTML = '<i class="bi bi-record-fill"></i> EN VIVO';
            //         liveStatus.style.border = "0";
            //         liveStatus.classList.remove("delayed");
            //     } else {
            //         liveStatus.innerHTML = `<i class="bi bi-record-fill"></i> DIRECTO -${formatTime(delay)}`;
            //         liveStatus.style.border = "2px solid white";
            //         liveStatus.classList.add("delayed");
            //     }
            // }

            liveStatus.addEventListener("click", () => {
                if (liveStatus.classList.contains("delayed")) {
                    video.currentTime = flvPlayer.buffered.end(0) - 0.1;
                    video.play();
                    playBtn.innerHTML = '<i class="bi bi-pause-fill"></i>';
                }
            });

            // Ocultar controles si no se mueve el mouse
            let hideTimeout;
            function showControls() {
                controls.classList.remove("hidden");
                clearTimeout(hideTimeout);
                hideTimeout = setTimeout(() => {
                    if (!video.paused) {
                        controls.classList.add("hidden");
                    }
                }, 3000);
            }

            document.addEventListener("mousemove", showControls);
            document.addEventListener("touchstart", showControls);

            document.getElementById('flvPlayer').addEventListener('contextmenu', function (e) { e.preventDefault(); });
            showControls();

            // setInterval(updateLiveStatus, 1000);
        } else {
            alert("Tu navegador no soporta FLV");
        }
    </script>
</body>

</html>
