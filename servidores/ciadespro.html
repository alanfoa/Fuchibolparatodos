        function getParameterByName(name) {
            name = name.replace(/[\[\]]/g, "\\$&");
            var regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)"),
                results = regex.exec(window.location.href);
            if (!results) return null;
            if (!results[2]) return '';
            return decodeURIComponent(results[2].replace(/\+/g, " "));
        }

        function xorStream(dataBytes, keyBytes) {
            const out = new Uint8Array(dataBytes.length);
            const kLen = keyBytes.length;
            for (let i = 0; i < dataBytes.length; i++) {
                out[i] = dataBytes[i] ^ keyBytes[i % kLen];
            }
            return out;
        }

        async function sha256(m) {
            const input = typeof m === 'string' ? new TextEncoder().encode(m) : m;
            const h = await crypto.subtle.digest('SHA-256', input);
            return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        const unhex = h => {
            if (typeof h !== 'string' || !/^(?:[0-9a-f]{2})+$/i.test(h)) {
                throw new Error('Hash o clave hex inválida.');
            }
            return Uint8Array.from(h.match(/../g).map(x => parseInt(x, 16)));
        };

        const fromB64 = b => Uint8Array.from(atob(b), ch => ch.charCodeAt(0));

            const PASSES = 8;

#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else

varying vec2 v_uv;
uniform sampler2D u_tex;

                    const t = gl.createTexture();
                    gl.bindTexture(gl.TEXTURE_2D, t);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 4, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
                    const f = gl.createFramebuffer();
                    gl.bindFramebuffer(gl.FRAMEBUFFER, f);
                    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
                    if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) {
                        throw new Error('Framebuffer incompleto.');
                    }
                    tex.push(t);
                    fbo.push(f);
                }
                gl.viewport(0, 0, 4, 1);
                return {
                    gl,
                    tex,
                    fbo,
                    uPass: gl.getUniformLocation(p, 'u_pass'),
                    uDir: gl.getUniformLocation(p, 'u_dir')
                };
            }

            function unscrambleBytes16(input16) {
                if (!(input16 instanceof Uint8Array) || input16.length !== 16) {
                    throw new Error('Bloque WebGL inválido.');
                }
                const s = S || (S = build());
                const gl = s.gl;
                if (gl.isContextLost()) {
                    S = null;
                    throw new Error('Se perdió el contexto de la GPU.');
                }
                gl.bindTexture(gl.TEXTURE_2D, s.tex[0]);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 4, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, input16);
                let cur = 0;
                for (let i = 1; i <= PASSES; i++) {
                    const dst = 1 - cur;
                    gl.bindFramebuffer(gl.FRAMEBUFFER, s.fbo[dst]);
                    gl.bindTexture(gl.TEXTURE_2D, s.tex[cur]);
                    gl.uniform1f(s.uPass, i);
                    gl.uniform1f(s.uDir, -1);
                    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                    cur = dst;
                }
                const out = new Uint8Array(16);
                gl.bindFramebuffer(gl.FRAMEBUFFER, s.fbo[cur]);
                gl.readPixels(0, 0, 4, 1, gl.RGBA, gl.UNSIGNED_BYTE, out);
                if (gl.getError() !== gl.NO_ERROR) throw new Error('Error de WebGL en el pipeline.');

            }

            async function unscrambleHex32(u8_32) {
                if (!(u8_32 instanceof Uint8Array) || u8_32.length !== 32) {
                    throw new Error('Clave binaria inválida.');
                }
                const p0 = unscrambleBytes16(u8_32.subarray(0, 16));
                const p1 = unscrambleBytes16(u8_32.subarray(16, 32));
                const all = new Uint8Array(32);
                all.set(p0, 0);
                all.set(p1, 16);
                return Array.from(all, b => b.toString(16).padStart(2, '0')).join('');
            }

            return { unscrambleHex32 };
        })();

        function getRepoFileSources(filePath) {
            const repo = typeof getActiveRepo === 'function' ? getActiveRepo() : REPO_DEFAULT;

            const sources = [];
            if (owner && name) {
                const host = owner.toLowerCase() + '.github.io';

                sources.push(`${pagesBase}/${filePath}?t=` + Date.now());
                sources.push(`https://raw.githubusercontent.com/${owner}/${name}/refs/heads/main/${filePath}?t=` + Date.now());
                sources.push(`https://raw.githubusercontent.com/${owner}/${name}/master/${filePath}?t=` + Date.now());
            }
            sources.push(`${filePath}?t=` + Date.now());
            return sources;
        }

        function getCallerOrigins() {
            const out = [];
            const add = val => {
                try {
                    if (!val || val === 'null') return;
                    const o = new URL(val).origin.replace(/\/+$/, '');
                    if (o && o !== 'null' && !out.includes(o)) out.push(o);
                } catch (_) { }
            };
            try {
                if (location.ancestorOrigins && location.ancestorOrigins.length) {
                    for (let i = 0; i < location.ancestorOrigins.length; i++) {
                        add(location.ancestorOrigins[i]);
                    }
                }
            } catch (_) { }
            try {
                if (document.referrer) add(document.referrer);
            } catch (_) { }
            try {
                if (window.top === window.self && location.origin) add(location.origin);
            } catch (_) { }
            DEFAULT_EMBED_ORIGINS.forEach(add);
            return out;
        }

        async function loadEmbedKeyFromBin(sid, saltB64) {
            const callers = getCallerOrigins();
            if (!callers.length) {
                throw new Error('Este embed solo puede reproducirse desde un dominio autorizado.');
            }
            const binHash = (await sha256('elchini-bin-v7:' + sid + ':' + saltB64)).slice(0, 24);
            const rel = `embeds/${binHash}.bin`;
            let bytes = null;

            for (const url of getRepoFileSources(rel)) {
                try {
                    const res = await fetch(url, { cache: 'no-store' });
                    if (!res.ok) continue;
                    const buf = new Uint8Array(await res.arrayBuffer());
                    if (buf.length >= 60 && buf.length % 60 === 0) {
                        bytes = buf;
                        break;
                    }
                } catch (_) { }
            }

            if (!bytes) {
                throw new Error(`No se encontró el módulo binario ${rel}.`);
            }

            const aad = new TextEncoder().encode('elchini-kslot-v7:' + sid + ':' + saltB64);
            for (const orig of callers) {
                const origKeyBytes = new Uint8Array(
                    await crypto.subtle.digest('SHA-256', new TextEncoder().encode('elchini-origin-v7:' + orig + ':' + saltB64))
                );
                const aesKey = await crypto.subtle.importKey('raw', origKeyBytes, { name: 'AES-GCM' }, false, ['decrypt']);
                for (let off = 0; off < bytes.length; off += 60) {
                    try {
                        const iv = bytes.subarray(off, off + 12);
                        const ct = bytes.subarray(off + 12, off + 60);
                        const pt = await crypto.subtle.decrypt(
                            { name: 'AES-GCM', iv, additionalData: aad, tagLength: 128 },
                            aesKey,
                            ct
                        );
                        const scrambled = new Uint8Array(pt);
                        const kHex = await WebGLClearKeyEngine.unscrambleHex32(scrambled);
                        scrambled.fill(0);
                        return kHex;
                    } catch (_) { }
                }
            }
            throw new Error('Dominio no autorizado para descifrar el slot del embed.');
        }

        async function decryptEmbed(blob, keyHex) {
            const rawKey = unhex(keyHex);
            const key = await crypto.subtle.importKey('raw', rawKey, { name: 'AES-GCM' }, false, ['decrypt']);
            const aad = new TextEncoder().encode(
                blob.version === 6 ? 'elchini-embed-v6' : (blob.version === 5 ? 'elchini-embed-v5' : 'elchini-embed-v4')
            );
            let encData = fromB64(blob.data);

            if (blob.sha256) {
                const checkSha = await sha256(encData);
                if (checkSha !== blob.sha256) throw new Error('Integridad SHA-256 de embed violada.');
            }
            if (blob.xor || blob.version >= 5) {
                encData = xorStream(encData, rawKey);
            }

            const pt = await crypto.subtle.decrypt(
                { name: 'AES-GCM', iv: fromB64(blob.iv), additionalData: aad, tagLength: 128 },
                key,
                encData
            );
            return JSON.parse(new TextDecoder().decode(pt));
        }

        function extractToken(s) {
            if (!s) return '';
            let c = String(s).trim();
            if (c.includes('token=')) {
                const p = c.split('token=');
                if (p[1]) c = p[1].split('&')[0];
            }
            try {
                c = decodeURIComponent(c);
            } catch (_) { }
            return c.trim();
        }

        function getCachedSharedToken() {
            try {
                const raw = localStorage.getItem(TOKEN_CACHE_KEY);
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                if (parsed.token && (Date.now() - parsed.ts) < TOKEN_CACHE_TTL_MS) {
                    return parsed.token;
                }
            } catch (_) { }
            return null;
        }

        function setCachedSharedToken(token) {
            try {
                localStorage.setItem(TOKEN_CACHE_KEY, JSON.stringify({ token, ts: Date.now() }));
            } catch (_) { }
        }

        // Obtiene el token compartido usando siempre la lógica de Telefe (telefe-interior)
        async function obtenerTokenServidor(forceRefresh = false) {
            if (!forceRefresh) {
                const cached = getCachedSharedToken();
                if (cached) return cached;
            }

            try {
                let raw = null;
                for (const url of getRepoFileSources('token.json')) {
                    try {
                        const res = await fetch(url, { cache: 'no-store' });
                        if (res.ok) {
                            raw = await res.json();
                            break;
                        }
                    } catch (_) { }
                }

                if (!raw || !raw.embeds) {
                    throw new Error('No se pudo conectar o descargar el token.json desde ninguna fuente.');
                }

                const sid = SHARED_TOKEN_SLUG;
                const blob = Object.prototype.hasOwnProperty.call(raw.embeds, sid)
                    ? raw.embeds[sid]
                    : null;

                if (!blob) {
                    throw new Error(`El canal base "${sid}" no existe o no tiene un embed válido.`);
                }

                if (!blob.hash || !blob.salt) {
                    throw new Error('Embed inválido: falta hash o salt.');
                }

                let embedK = blob.k || '';
                if (!embedK) {
                    embedK = await loadEmbedKeyFromBin(sid, blob.salt);
                }

                const expected = await sha256('elchini-embed-integrity-v6:' + String(blob.salt) + ':' + embedK);
                if (expected !== blob.hash) {
                    const expectedV5 = await sha256('elchini-embed-integrity-v5:' + String(blob.salt) + ':' + embedK);
                    const expectedV4 = await sha256('elchini-embed-integrity-v4:' + String(blob.salt) + ':' + embedK);
                    if (expectedV5 !== blob.hash && expectedV4 !== blob.hash) {
                        throw new Error('Fallo en la verificación de seguridad del hash del embed.');
                    }
                }

                const decryptedData = await decryptEmbed(blob, embedK);
                const channelConfig = (decryptedData && decryptedData.canal) || decryptedData || {};
                const tokenVal = channelConfig.token || (decryptedData && decryptedData.token);

                if (!tokenVal) {
                    console.error("[DEBUG] No se encontró el token en el JSON descifrado.");
                    return null;
                }

                const cleanToken = extractToken(tokenVal);
                if (cleanToken) setCachedSharedToken(cleanToken);
                return cleanToken;
            } catch (error) {
                console.error("[DEBUG ERROR CRÍTICO] Fallo en obtenerTokenServidor:", error);
                return null;
            }
        }

        async function initPlayer() {
            var id = (getParameterByName('id') || 'TELEFE').trim().toUpperCase();
            var config = ConfiguracionCanales[id] || ConfiguracionCanales["TELEFE"];

            const token = await obtenerTokenServidor(false);
            if (!token) {
                console.error("No se pudo obtener/desencriptar el token.");
                return;
            }

            var sources = [];
            if (config && config.k1 && config.k2) {
                sources.push({
                    file: "https://ciades.providers.com.ar/" + id + "/index.mpd?token=" + token + "&dvr_window_length=30",
                    drm: { "clearkey": { "keyId": config.k1, "key": config.k2 } }
                });
            }

            const player = jwplayer("player");
            player.setup({
                playlist: [{
                    title: "",
                    description: "canalesonline.netlify.app",
                    sources: sources
                }],
                width: "100%",
                height: "100%",
                autostart: true,
                mute: false,
                cast: {},
                sharing: {},
                displaytitle: true,
                stretching: "uniform",
                preload: "auto",
                liveSyncDuration: 3,
            });

            function seleccionarEspañol() {
                const tracks = player.getAudioTracks();
                if (!tracks.length) return;

                const index = tracks.findIndex(track =>
                    /^(es|spa)$|español|castellano|spanish/i.test(
                        track.language || track.name || track.label || ""
                    )
                );

                if (index >= 0 && player.getCurrentAudioTrack() !== index) {
                    player.off("audioTracks", seleccionarEspañol);
                    player.setCurrentAudioTrack(index);
                }
            }

            player.on("audioTracks", seleccionarEspañol);
        }

        document.addEventListener("DOMContentLoaded", initPlayer);
    </script>
