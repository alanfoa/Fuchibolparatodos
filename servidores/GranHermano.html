<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="noindex, nofollow, noarchive" name="robots" />
    <meta name="referrer" content="no-referrer" />
    <title>Gran Hermano</title>
    <style>
        html,
        body,
        #player {
            width: 100% !important;
            height: 100% !important;
            margin: 0;
            padding: 0;
            background-color: black;
            color: white;
        }

        :root {
            --colorbarra: #51E0C0;
            --coloriconos: #f0f0f0;
        }

        .jw-button-container .jw-icon {
            color: var(--coloriconos) !important;
        }

        .jw-slider-container .jw-progress {
            background-color: var(--colorbarra) !important;
        }

        .jw-icon:hover {
            color: var(--colorbarra) !important;
        }

        .jw-featured,
        .jw-rightclick {
            display: none !important;
        }
    </style>
    <link rel="stylesheet" href="style-jw.css">

    <!-- JW Player -->
    <script src="//ssl.p.jwpcdn.com/player/v/8.26.0/jwplayer.js"></script>
    <script>jwplayer.key = "XSuP4qMl+9tK17QNb+4+th2Pm9AWgMO/cYH8CI0HGGr7bdjo";</script>
</head>

<body>
    <div id="player" class="ViostreamIframe"></div>

    <script src="../js/script-config.js"></script>
    <script>
        function getParameterByName(name) {
            name = name.replace(/[\[\]]/g, "\\$&");
            var regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)"),
                results = regex.exec(window.location.href);
            if (!results) return null;
            if (!results[2]) return '';
            return decodeURIComponent(results[2].replace(/\+/g, " "));
        }

        var ConfiguracionCanales = {
            // ---------------------------------

            "24h": {
                url: "https://cablered.iptvperu.tv:1936/stream/gh24hs/playlist.m3u8",
            },
            "multicam": {
                url: "https://cablered.iptvperu.tv:1936/stream/ghmulticam/playlist.m3u8",
            },
            "cam1": {
                url: "https://artemisa1.cd-latam.com:1936/stream/ghcam1/playlist.m3u8",
            },
            "cam2": {
                url: "https://artemisa1.cd-latam.com:1936/stream/ghcam2/playlist.m3u8",
            },
            "cam3": {
                url: "https://artemisa1.cd-latam.com:1936/stream/ghcam3/playlist.m3u8",
            },
        };

        var id = getParameterByName('id');
        var config = ConfiguracionCanales[id];

        if (config) {
            var sources = [];

            if (config.url.includes('.m3u8')) {
                sources.push({
                    file: config.url
                });
            }

            if (config.url.includes('.mpd') && config.k1 && config.k2) {
                sources.push({
                    // file: "https://cors-proxy.wangzhishi.net/"+config.url,
                    file: config.url,
                    drm: { "clearkey": { "keyId": config.k1, "key": config.k2 } }
                });
            }

            // JWWWWWW
            jwplayer("player").setup({
                playlist: [{
                    title: "",
                    description: "canalesonline.netlify.app",
                    sources: sources
                }],
                width: "100%",
                height: "100%",
                autostart: true,
                mute: false,
                cast: {},
                sharing: {},
                // androidhls: true,
                displaytitle: true,
                stretching: "uniform",
                preload: "auto",
                liveSyncDuration: 3,
            });

            var lang = 1; // Por defecto en español
            jwplayer().on('play', function (e) {
                jwplayer().setCurrentAudioTrack(lang);
            });
        } else {
            document.getElementById("player").innerHTML = '<h2 class="error-message">Canal inválido o no encontrado.</h2>';
        }
    </script>
</body>

</html>
