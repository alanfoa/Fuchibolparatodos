    <title>megacable</title>
    <style>
        html,
        body {
            width: 100% !important;
            height: 100% !important;
            margin: 0;
            padding: 0;
            background: #000;
        }

        #flow-player {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #fp_video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        #fp_fs {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 30;
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity .3s ease, background-color .2s ease;
        }

        #fp_fs:hover {
            background: rgba(20, 171, 209, 0.35);
        }

        .controls {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px 12px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.45) 60%, transparent 100%);
            transition: opacity .3s ease;
        }

        #fp_play,
        #fp_mute,
        #fp_gear {
            background: transparent;
            border: none;
            cursor: pointer;
            width: 34px;
            height: 34px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background-color .18s ease, transform .18s ease;
        }

        #fp_play:hover,
        #fp_mute:hover,
        #fp_gear:hover {
            background-color: rgba(20, 171, 209, 0.22);
            transform: scale(1.08);
        }

        #fp_bar {
            flex: 1;
            height: 4px;
            cursor: pointer;
            accent-color: #14abd1;
        }

        #fp_qmenu {
            position: absolute;
            right: 14px;
            bottom: 58px;
            z-index: 40;
            min-width: 100px;
            background: rgba(10, 10, 12, 0.92);
            border: 1px solid rgba(20, 171, 209, 0.25);
            border-radius: 8px;
            padding: 6px 0;
            display: none;
        }

        #fp_qmenu div {
            padding: 8px 16px;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
        }

        #fp_qmenu div:hover {
            background: rgba(20, 171, 209, 0.25);
        }

        /* Auto-ocultar controles */
        #flow-player.hide-ui .controls,
        #flow-player.hide-ui #fp_fs {
            opacity: 0;
            pointer-events: none;
        }

        /* Fallback de landscape para iOS (no soporta screen.orientation.lock) */
        #flow-player.ios-landscape {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vh;
            height: 100vw;
            transform: rotate(90deg) translateY(-100%);
            transform-origin: top left;
            z-index: 9999;
        }
    </style>

        var id = getParameterByName('id');
        var config = ConfiguracionCanales[id];

        const video = document.getElementById("fp_video");
        const bar = document.getElementById("fp_bar");
        const play = document.getElementById("fp_play");
        const icoPlay = document.getElementById("fp_icoPlay");
        const icoPause = document.getElementById("fp_icoPause");
        const mute = document.getElementById("fp_mute");
        const fs = document.getElementById("fp_fs");
        const gear = document.getElementById("fp_gear");
        const qmenu = document.getElementById("fp_qmenu");
        const box = document.getElementById("flow-player");

        video.muted = false;

        async function initShaka() {
            shaka.polyfill.installAll();

            if (!shaka.Player.isBrowserSupported()) {
                console.error("Shaka Player no soportado");
                return;
            }

            if (!config) {
                console.error("No se encontró configuración para el canal solicitado (id=" + id + ").");
                return;
            }

            const player = new shaka.Player(video);

            const drmConfig = {};
            if (config.clearkey) {
                // Multikey ClearKey: acepta 1, 2, 3, 10+ keys tal cual venga en la config del canal
                drmConfig.clearKeys = config.clearkey;
            }

            player.configure({
                drm: drmConfig,
                abr: { enabled: false },
                preferredAudioLanguage: "es",
                preferredTextLanguage: "es",
                streaming: {
                    liveSync: {
                        enabled: true,
                        targetLatency: 3,
                        targetLatencyTolerance: 0.5
                    },
                    bufferingGoal: 10
                }
            });

            player.addEventListener("error", e => console.error("Shaka error:", e.detail));

            try {
                await player.load(config.url+"master_wv.m3u8?CN=3e170184-8ead-48e5-94a7-66c05ba4e1f6");
                console.log("Manifiesto cargado con éxito:", config.url);
            } catch (e) {
                console.error("Error cargando el manifiesto:", e);
                return;
            }

            // Menú de calidad (dedupeando resoluciones repetidas por distinto codec)
            const tracks = player.getVariantTracks();
            const porAltura = new Map();
            tracks.filter(t => t.height).forEach(t => {
                const actual = porAltura.get(t.height);
                if (!actual || (t.bandwidth || 0) > (actual.bandwidth || 0)) {
                    porAltura.set(t.height, t);
                }
            });

            qmenu.innerHTML = "";
            const auto = document.createElement("div");
            auto.textContent = "Auto";
            auto.onclick = () => { player.configure({ abr: { enabled: true } }); qmenu.style.display = "none"; };
            qmenu.appendChild(auto);

            Array.from(porAltura.values())
                .sort((a, b) => b.height - a.height)
                .forEach(t => {
                    const d = document.createElement("div");
                    d.textContent = t.height + "p";
                    d.onclick = () => {
                        player.configure({ abr: { enabled: false } });
                        player.selectVariantTrack(t, true);
                        qmenu.style.display = "none";
                    };
                    qmenu.appendChild(d);
                });
        }

        initShaka();

        /* ===== Controles (sin tocar) ===== */
        play.onclick = () => video.paused ? video.play() : video.pause();
        video.onplay = () => { icoPlay.style.display = "none"; icoPause.style.display = "block"; showUI(); };
        video.onpause = () => { icoPlay.style.display = "block"; icoPause.style.display = "none"; box.classList.remove("hide-ui"); };

        video.ontimeupdate = () => { bar.max = video.duration || 0; bar.value = video.currentTime; };
        bar.oninput = () => video.currentTime = bar.value;

        mute.onclick = () => video.muted = !video.muted;

        function toggleFS() { if (!document.fullscreenElement) box.requestFullscreen(); else document.exitFullscreen(); }
        fs.onclick = toggleFS;

        video.ondblclick = toggleFS;
        let lastTap = 0;
        video.ontouchend = () => {
            const now = Date.now();
            if (now - lastTap < 300) toggleFS();
            lastTap = now;
        };

        gear.onclick = () => { qmenu.style.display = qmenu.style.display === "block" ? "none" : "block"; };

        /* landscape */
        const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
        document.addEventListener("fullscreenchange", async () => {
            if (document.fullscreenElement) {
                if (!isIOS && screen.orientation?.lock) { try { await screen.orientation.lock("landscape") } catch (e) { } }
                if (isIOS) box.classList.add("ios-landscape");
            } else {
                if (!isIOS && screen.orientation?.unlock) { try { screen.orientation.unlock() } catch (e) { } }
                box.classList.remove("ios-landscape");
            }
        });

        /* auto hide */
        let uiTimer;
        function showUI() {
            box.classList.remove("hide-ui");
            clearTimeout(uiTimer);
            if (!video.paused) {
                uiTimer = setTimeout(() => { box.classList.add("hide-ui"); }, 2500);
            }
        }
        box.addEventListener("mousemove", showUI);
        box.addEventListener("touchstart", showUI);
        box.addEventListener("click", showUI);
    </script>
