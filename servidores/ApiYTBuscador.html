<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Api YouTube</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: sans-serif;
        }

        /* ── Barra de búsqueda fija ── */
        #topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            z-index: 10000;
            background: #0f0f0f;
            border-bottom: 1px solid #303030;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 10px;
        }

        #inputBuscar {
            flex: 1;
            padding: 9px 14px;
            border-radius: 20px;
            border: 1px solid #303030;
            outline: none;
            background: #121212;
            color: white;
            font-size: 15px;
        }

        #inputBuscar:focus {
            border-color: #3ea6ff;
        }

        #topbar button {
            padding: 9px 16px;
            border-radius: 20px;
            border: none;
            background: #272727;
            color: white;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        #topbar button.principal {
            background: red;
        }

        /* ── Área de contenido debajo de la barra ── */
        #content {
            position: fixed;
            top: 56px;
            left: 0;
            right: 0;
            bottom: 0;
        }

        #playerWrap {
            width: 100%;
            height: 100%;
            background: #000;
            position: relative;
        }

        #player {
            width: 100%;
            height: 100%;
        }

        #resultados {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            padding: 14px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            grid-auto-rows: min-content;
            align-content: start;
            align-items: start;
            gap: 16px;
            background: #0a0a0a;
        }

        /* ── Celulares: forzar 2 columnas ── */
        @media (max-width: 700px) {
            #topbar {
                padding: 0 6px;
                gap: 6px;
            }

            #inputBuscar {
                min-width: 0; /* sin esto, el input no se achica y empuja los botones fuera de pantalla */
                padding: 8px 10px;
                font-size: 14px;
            }

            #topbar button {
                padding: 8px 12px;
                font-size: 13px;
            }

            #resultados {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
                padding: 8px;
            }

            .video-card-title {
                font-size: 12px;
            }

            .video-card-meta {
                font-size: 11px;
            }
        }

        .oculto {
            display: none !important;
        }

        .video-card {
            cursor: pointer;
            color: white;
            background: #181818;
            border-radius: 8px;
            /* overflow: hidden; */
            transition: transform 0.15s;
        }

        .video-card:hover {
            transform: scale(1.02);
        }

        .video-card img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            display: block;
            background: #222;
        }

        .video-card-info {
            padding: 8px 10px;
        }

        .video-card-title {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-card-meta {
            font-size: 12px;
            color: #aaa;
            margin-top: 4px;
        }

        .search-estado {
            color: #aaa;
            text-align: center;
            padding: 30px;
            grid-column: 1 / -1;
        }

        /* ── spinner ── */
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            z-index: 9999;
        }

        .spinner {
            width: 80px;
            height: 80px;
            border: 8px solid #666;
            border-top: 8px solid red;
            border-radius: 50%;
            animation: girar 1s linear infinite;
        }

        @keyframes girar {
            from { transform: rotate(0) }
            to { transform: rotate(360deg) }
        }

        .mensaje {
            color: white;
            text-align: center;
            padding-top: 40px;
        }
    </style>

    <script src="https://www.youtube.com/iframe_api"></script>
</head>

<body>

    <div id="topbar">
        <input type="text" id="inputBuscar" placeholder="Buscar en YouTube..."
               onkeydown="if(event.key==='Enter') buscarYoutube()">
        <button class="principal" onclick="buscarYoutube()">Buscar</button>
        <button onclick="cargarInicio()">Inicio</button>
        <button id="btnCerrarTop" class="oculto" onclick="cerrarPlayer()" title="Cerrar">✕</button>
    </div>

    <div id="content">
        <div id="playerWrap" class="oculto">
            <div id="player"></div>
        </div>
        <div id="resultados"></div>
    </div>

    <div id="loading">
        <div class="spinner"></div>
    </div>

    <script src="../js/script-config.js"></script>
    <script>

        // ── Cambiá esto por la URL de tu Worker ────────────────────────
        // const PROXY = "https://proxyplayerytpro.canalesonline24.workers.dev";
        const PROXY = "https://proxyplayerytpro.marianobarrera990.workers.dev/";
        // ──────────────────────────────────────────────────────────────

        // ── Tus canales fijos para la pantalla de Inicio ────────────────
        // "canal" tiene que ser el @handle exacto tal cual aparece en la
        // URL de YouTube (youtube.com/@handle), porque se arma la URL
        // como youtube.com/CANAL/live para buscar el ID del video en vivo.
        const CANALES = [
            { nombre: "Luzu TV", canal: "@LuzuTV", color: "#ff5c00" },
            { nombre: "Olga", canal: "@olgaenvivo_", color: "#00c2ff" },
            { nombre: "AZZ", canal: "@somosazz", color: "#c0c0c0" },
            { nombre: "Vorterix", canal: "@VorterixOficial", color: "#000000" },
            { nombre: "Blender", canal: "@estoesblender", color: "#7a2be2" },
            { nombre: "Infobae", canal: "@infobae", color: "#0033a0" },
            { nombre: "La Casa Streaming", canal: "@somoslacasa", color: "#8b4513" },
            { nombre: "Carnaval", canal: "@carnavalstream", color: "#ff1493" },
            { nombre: "Resumido", canal: "@resumido", color: "#009933" },
            { nombre: "Bondi Live", canal: "@Bondi_liveok", color: "#ffcc00" },
            { nombre: "Picado TV", canal: "@picadotvok", color: "#228b22" },
            { nombre: "Gelatina", canal: "@SomosGelatina", color: "#ff69b4" },
            { nombre: "Carajo", canal: "@carajostream", color: "#ff0000" },
            { nombre: "Futurock", canal: "@Futurock", color: "#1e90ff" },
            { nombre: "DGO Stream", canal: "@dgo_stream", color: "#555555" },
            { nombre: "A24", canal: "@A24com", color: "#e10600" },
            { nombre: "URBANA PLAY", canal: "@UrbanaPlayFM", color: "#e10600" },
            { nombre: "Canal 8 San Juan", canal: "@canal8sanjuan.", color: "#e10600" },
            { nombre: "LN+", canal: "@lanacion", color: "#e10600" },
            { nombre: "El Nueve", canal: "@elnueve", color: "#e10600" },
            { nombre: "El Siete Mendoza", canal: "@elsietemendoza", color: "#e10600" },
            { nombre: "Canal 26", canal: "@canal26", color: "#e10600" },
            // { nombre: "Canal de la Cuidad", canal: "@canalciudadba", color: "#e10600" },
            { nombre: "El Doce", canal: "@eldoce", color: "#e10600" },
            { nombre: "Canal Rural", canal: "@canalrural", color: "#e10600" },
            { nombre: "UN POCO DE RUIDO", canal: "@Updr", color: "#e10600" },
        ];
        // ──────────────────────────────────────────────────────────────

        const THUMB_CACHE_HORAS = 24; // cuánto tiempo se reutiliza la miniatura cacheada

        function getThumbCache(canal) {
            try {
                const raw = localStorage.getItem("thumb_" + canal);
                if (!raw) return null;
                const obj = JSON.parse(raw);
                if (Date.now() - obj.ts > THUMB_CACHE_HORAS * 3600 * 1000) return null;
                return obj.url;
            } catch (e) {
                return null;
            }
        }

        function setThumbCache(canal, url) {
            try {
                localStorage.setItem("thumb_" + canal, JSON.stringify({ url, ts: Date.now() }));
            } catch (e) {
                // localStorage lleno o no disponible, no pasa nada
            }
        }

        async function getChannelThumbnail(canal) {
            const cached = getThumbCache(canal);
            if (cached) return cached;

            try {
                const channelUrl = "https://www.youtube.com/" + canal;
                const url = PROXY + "/?url=" + encodeURIComponent(channelUrl) + "&type=avatar";
                const r = await fetch(url);
                const data = await r.json();
                if (data && data.thumbnail) {
                    setThumbCache(canal, data.thumbnail);
                    return data.thumbnail;
                }
            } catch (e) {
                console.error("ERROR getChannelThumbnail:", e);
            }
            return null;
        }

        let playerActual = null;

        function showLoading() {
            document.getElementById("loading").style.display = "flex";
        }

        function hideLoading() {
            document.getElementById("loading").style.display = "none";
        }

        function getParam(name) {
            return new URLSearchParams(location.search).get(name);
        }

        // Acepta un ID puro (ej: _l_S1bLPkAs) o una URL completa de YouTube
        function extractVideoId(input) {
            if (!input) return null;

            if (/^[a-zA-Z0-9_-]{11}$/.test(input)) {
                return input;
            }

            try {
                const url = new URL(input);

                if (url.searchParams.has("v")) {
                    return url.searchParams.get("v");
                }

                const match = url.pathname.match(/\/(?:live|embed|shorts)\/([a-zA-Z0-9_-]{11})/)
                    || url.pathname.match(/^\/([a-zA-Z0-9_-]{11})$/);

                if (match) return match[1];

            } catch (e) {
                const fallback = input.match(/(?:v=|\/live\/|\/embed\/|\/shorts\/|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
                if (fallback) return fallback[1];
            }

            return null;
        }

        async function getLiveId(canal) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 15000); // 15s máx

            try {
                let url = PROXY + "/?url=https://www.youtube.com/" + canal + "/live";
                let r = await fetch(url, { signal: controller.signal });
                let data = await r.json();
                return data.videoId || null;
            } catch (e) {
                console.error("ERROR getLiveId:", e);
                return null;
            } finally {
                clearTimeout(timeoutId);
            }
        }

        // Recuerda qué había en la grilla antes de reproducir un video,
        // para poder volver ahí exactamente (y no siempre a Inicio).
        let ultimaVistaGrid = { tipo: "canales", datos: null };

        function mostrarVista(vista) {
            // vista: "player" | "grid"
            document.getElementById("playerWrap").classList.toggle("oculto", vista !== "player");
            document.getElementById("resultados").classList.toggle("oculto", vista !== "grid");
            document.getElementById("btnCerrarTop").classList.toggle("oculto", vista !== "player");

            // Si dejamos de mostrar el player, hay que detenerlo,
            // sino sigue reproduciéndose oculto en el fondo.
            if (vista !== "player") {
                detenerPlayer();
            }
        }

        function detenerPlayer() {
            if (playerActual && typeof playerActual.stopVideo === "function") {
                try {
                    playerActual.stopVideo();
                } catch (e) {
                    console.error("ERROR al detener el player:", e);
                }
            }
        }

        function createPlayer(videoId) {
            mostrarVista("player");
            showLoading();

            // Si ya había un player instanciado, lo destruimos. destroy() se
            // lleva puesto el <div id="player"> (lo reemplaza por el iframe),
            // así que después hay que recrear el div antes de instanciar uno nuevo.
            if (playerActual && typeof playerActual.destroy === "function") {
                try {
                    playerActual.destroy();
                } catch (e) {
                    console.error("ERROR al destruir el player anterior:", e);
                }
                playerActual = null;
            }

            const playerWrap = document.getElementById("playerWrap");
            const viejoDiv = document.getElementById("player");
            if (viejoDiv) viejoDiv.remove();
            const nuevoDiv = document.createElement("div");
            nuevoDiv.id = "player";
            playerWrap.appendChild(nuevoDiv);

            playerActual = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: videoId,
                playerVars: { autoplay: 1, controls: 1, origin: location.origin },
                events: {
                    onReady: () => hideLoading(),
                    onError: () => {
                        hideLoading();
                        document.getElementById("player").innerHTML =
                            "<div class='mensaje'>Error cargando video</div>";
                    }
                }
            });
        }

        function reproducirVideo(videoId) {
            mostrarVista("player");
            if (playerActual && playerActual.loadVideoById) {
                showLoading();
                playerActual.loadVideoById(videoId);
                setTimeout(hideLoading, 600);
            } else {
                createPlayer(videoId);
            }
        }

        async function reproducirCanal(canal) {
            mostrarVista("player");
            showLoading();
            const id = await getLiveId(canal);
            if (id) {
                createPlayer(id);
            } else {
                mostrarError("No se encontró transmisión en vivo para " + canal);
            }
        }

        function cerrarPlayer() {
            detenerPlayer();
            mostrarVista("grid");

            if (ultimaVistaGrid.tipo === "busqueda") {
                renderGrid(ultimaVistaGrid.datos);
            } else {
                renderChannelGrid();
            }
        }

        function mostrarError(msg) {
            hideLoading();
            mostrarVista("player");
            document.getElementById("player").innerHTML =
                "<div class='mensaje'>" + msg + "</div>";
        }

        // ── Grilla de resultados de búsqueda (YouTube) ──

        function renderGrid(data) {
            ultimaVistaGrid = { tipo: "busqueda", datos: data };

            const cont = document.getElementById("resultados");

            if (!data || !data.length) {
                cont.innerHTML = "<div class='search-estado'>Sin resultados</div>";
                return;
            }

            cont.innerHTML = "";
            data.forEach(v => {
                const card = document.createElement("div");
                card.className = "video-card";
                card.onclick = () => reproducirVideo(v.videoId);
                card.innerHTML = `
                    <img src="${v.thumbnail}" alt="" loading="lazy">
                    <div class="video-card-info">
                        <div class="video-card-title">${escapeHtml(v.title)}</div>
                        <div class="video-card-meta">${escapeHtml(v.channel)}${v.views ? " · " + escapeHtml(v.views) : ""}</div>
                    </div>`;
                cont.appendChild(card);
            });
        }

        // ── Grilla de canales fijos (pantalla de Inicio) ──

        function renderChannelGrid() {
            ultimaVistaGrid = { tipo: "canales", datos: null };

            const cont = document.getElementById("resultados");

            if (!CANALES.length) {
                cont.innerHTML = "<div class='search-estado'>No agregaste canales todavía</div>";
                return;
            }

            cont.innerHTML = "";
            CANALES.forEach(c => {
                const card = document.createElement("div");
                card.className = "video-card";
                card.onclick = () => reproducirCanal(c.canal);

                const imgId = "thumb-" + c.canal.replace(/[^a-zA-Z0-9]/g, "");

                card.innerHTML = `
                    <div id="${imgId}" style="width:100%;aspect-ratio:16/9;background:${c.color || '#333'};
                                display:flex;align-items:center;justify-content:center;
                                color:white;font-weight:bold;font-size:18px;border-radius:8px 8px 0 0;
                                overflow:hidden;">
                        ${escapeHtml(c.nombre)}
                    </div>
                    <div class="video-card-info">
                        <div class="video-card-title">${escapeHtml(c.nombre)}</div>
                        <div class="video-card-meta">EN VIVO</div>
                    </div>`;
                cont.appendChild(card);

                // Cargar la miniatura real del canal en segundo plano (con cache)
                getChannelThumbnail(c.canal).then(url => {
                    if (!url) return;
                    const holder = document.getElementById(imgId);
                    if (!holder) return; // el usuario ya cambió de vista, no tocar nada
                    holder.style.background = "#000";
                    holder.innerHTML = `<img src="${url}" alt="${escapeHtml(c.nombre)}"
                        style="width:100%;height:100%;object-fit:cover;">`;
                });
            });
        }

        function escapeHtml(str) {
            const d = document.createElement("div");
            d.textContent = str || "";
            return d.innerHTML;
        }

        async function buscarYoutube() {
            const query = document.getElementById("inputBuscar").value.trim();
            if (!query) {
                cargarInicio();
                return;
            }

            mostrarVista("grid");
            document.getElementById("resultados").innerHTML = "<div class='search-estado'>Buscando...</div>";

            try {
                const searchUrl = "https://www.youtube.com/results?search_query=" + encodeURIComponent(query);
                const url = PROXY + "/?url=" + encodeURIComponent(searchUrl) + "&type=search";
                const r = await fetch(url);
                const data = await r.json();
                renderGrid(data);
            } catch (e) {
                console.error("ERROR buscarYoutube:", e);
                document.getElementById("resultados").innerHTML = "<div class='search-estado'>Error al buscar</div>";
            }
        }

        function cargarInicio() {
            document.getElementById("inputBuscar").value = "";
            mostrarVista("grid");
            renderChannelGrid();
        }

        function onYouTubeIframeAPIReady() {
            let getRaw = getParam("get");
            let canal = getParam("canal");

            if (getRaw) {
                let videoId = extractVideoId(getRaw);
                if (videoId) {
                    createPlayer(videoId);
                } else {
                    mostrarError("No se pudo obtener el ID del video desde ?get=");
                }
            } else if (canal) {
                showLoading();
                mostrarVista("player");
                getLiveId(canal).then(id => {
                    if (id) {
                        createPlayer(id);
                    } else {
                        mostrarError("No se encontró ID de video en vivo");
                    }
                }).catch(() => mostrarError("Error en la petición al proxy"));
            } else {
                hideLoading();
                cargarInicio();
            }
        }

        if (window.YT && window.YT.Player) {
            onYouTubeIframeAPIReady();
        } else if (!getParam("get") && !getParam("canal")) {
            hideLoading();
            cargarInicio();
        }

    </script>
</body>

</html>
