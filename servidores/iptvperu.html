<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="noindex, nofollow, noarchive" name="robots" />
    <meta name="referrer" content="no-referrer" />
    <title>iptvperu</title>
    <style>
        html,
        body,
        #player {
            width: 100% !important;
            height: 100% !important;
            margin: 0;
            padding: 0;
            background-color: black;
            color: white;
        }

        :root {
            --colorbarra: #51E0C0;
            --coloriconos: #f0f0f0;
        }

        .jw-button-container .jw-icon {
            color: var(--coloriconos) !important;
        }

        .jw-slider-container .jw-progress {
            background-color: var(--colorbarra) !important;
        }

        .jw-icon:hover {
            color: var(--colorbarra) !important;
        }

        .jw-featured,
        .jw-rightclick {
            display: none !important;
        }
    </style>
    <link rel="stylesheet" href="style-jw.css">

    <!-- JW Player -->
    <script src="//ssl.p.jwpcdn.com/player/v/8.26.0/jwplayer.js"></script>
    <script>jwplayer.key = "XSuP4qMl+9tK17QNb+4+th2Pm9AWgMO/cYH8CI0HGGr7bdjo";</script>
</head>

<body>
    <div id="player" class="ViostreamIframe"></div>
    <script>
        function getParameterByName(name) {
            name = name.replace(/[\[\]]/g, "\\$&");
            var regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)"),
                results = regex.exec(window.location.href);
            if (!results) return null;
            if (!results[2]) return '';
            return decodeURIComponent(results[2].replace(/\+/g, " "));
        }

        var ConfiguracionCanales = {
            "cinehispano": { url: "https://bantel-cdn1.iptvperu.tv:1936/btnscrtn/cinehispano.stream/playlist.m3u8", },
            "cinepremium": { url: "https://bantel-cdn1.iptvperu.tv:1936/btnscrtn/cinepremium.stream/playlist.m3u8", },
            "cinefamiliar": { url: "https://bantel-cdn1.iptvperu.tv:1936/btnscrtn/cinefamiliar.stream/playlist.m3u8", },
            "america": { url: "https://bantel-cdn1.iptvperu.tv:1936/btnscrtn/america.stream/playlist.m3u8", },
            "LoveNature": { url: "https://bantel-cdn1.iptvperu.tv:1936/btnscrtn/LoveNature/playlist.m3u8", },
            "canalinfantil": { url: "https://bantel-cdn1.iptvperu.tv:1936/btnscrtn/canalinfantil/playlist.m3u8", },
        }

        var id = getParameterByName('id');
        var config = ConfiguracionCanales[id];

        if (config) {
            var sources = [];

            if (config.url.includes('.m3u8')) {
                sources.push({
                    file: config.url
                });
            }

            if (config.url.includes('.mpd') && config.k1 && config.k2) {
                sources.push({
                    file: config.url,
                    drm: { "clearkey": { "keyId": config.k1, "key": config.k2 } }
                });
            }

            // JWWWWWW
            jwplayer("player").setup({
                playlist: [{
                    title: "",
                    description: "canalesonline.netlify.app",
                    sources: sources
                }],
                width: "100%",
                height: "100%",
                autostart: true,
                mute: false,
                cast: {},
                sharing: {},
                // androidhls: true,
                displaytitle: true,
                stretching: "uniform",
                preload: "auto",
                liveSyncDuration: 3,
            });
        } else {
            document.getElementById("player").innerHTML = '<h2 class="error-message">Canal inválido o no encontrado.</h2>';
        }
    </script>
    <script src="../js/script-config.js"></script>
</body>

</html>
