<body>
    <div id="player" class="ViostreamIframe"></div>

    <!-- <script src="https://canalesonline.netlify.app/js/script-config.js"></script> -->
    <script src="../js/script-config.js"></script>
    <script>

        function getParameterByName(name) {
            name = name.replace(/[\[\]]/g, "\\$&");
            var regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)"),
                results = regex.exec(window.location.href);
            if (!results) return null;
            if (!results[2]) return '';
            return decodeURIComponent(results[2].replace(/\+/g, " "));
        }

        let id = getParameterByName('id');
        let stream;
        switch (id) {


            case "musictop": stream = "https://stream-gtlc.telecentro.net.ar/hls/musictophls/main.m3u8"; break;
            case "musictop2": stream = "https://stream-gtlc.telecentro.net.ar/hls/musictophls/0/playlist.m3u8"; break;
            case "latinatv": stream = "https://stream-gtlc.telecentro.net.ar/hls/latinatvhls/main.m3u8"; break;
            case "telemax": stream = "https://stream-gtlc.telecentro.net.ar/hls/telemaxhls/main.m3u8"; break;
            case "tierramia": stream = "https://stream-gtlc.telecentro.net.ar/hls/tierramiahls/main.m3u8"; break;
            case "canal26": stream = "https://stream-gtlc.telecentro.net.ar/hls/canal26hls/main.m3u8"; break;



        }

        if (stream) {
            jwplayer("player").setup({
                title: "",
                description: "canalesonline.netlify.app",
                file: stream,
                type: "dash",
                width: "100%",
                height: "100%",
                autostart: true,
                mute: false,
                cast: {},
                sharing: {},
                // androidhls: true,
                displaytitle: true,
                stretching: "uniform",
                preload: "auto",
                liveSyncDuration: 3,
            });

            if (!/SmartTV|Tizen|Web0S|SmartHub|Chromecast/i.test(navigator.userAgent)) {
                // Esperar a que el reproductor esté listo
                jwplayer("player").on("ready", function () {
                    var videoElement = document.querySelector("#player video");
                    if (videoElement) {
                        var audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        var source = audioContext.createMediaElementSource(videoElement);
                        var gainNode = audioContext.createGain();

                        gainNode.gain.value = 2;
                        source.connect(gainNode);
                        gainNode.connect(audioContext.destination);
                    }
                });
            }

            // var lang = 0; // Por defecto en español
            // jwplayer().on('play', function (e) {
            //     jwplayer().setCurrentAudioTrack(lang);
            // });
        }


    </script>
