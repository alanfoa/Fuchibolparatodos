    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111115;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Barra Superior */
        header {
            background-color: #141418;
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            border-bottom: 1px solid #22222a;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .search-input {
            background: #25252b;
            border: 1px solid #3a3a45;
            padding: 10px 18px;
            border-radius: 20px;
            color: #fff;
            outline: none;
            width: 320px;
            font-size: 0.95rem;
            transition: border-color 0.3s ease;
        }

        .search-input:focus {
            border-color: #e50914;
        }

        .btn-filter {
            background: #e50914;
            border: none;
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .btn-filter:hover {
            background: #f40612;
        }

        .btn-favs {
            background: #25252b;
            border: 1px solid #3a3a45;
            color: #fff;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .btn-favs:hover {
            background: #33333d;
        }

        /* Contenedor de la Grilla */
        .catalog-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
            flex: 1;
            width: 100%;
        }

        .grid-channels {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 24px;
        }

        /* Tarjeta de Canal Estilo Netflix */
        .channel-card {
            background-color: #1a1a22;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            aspect-ratio: 16/9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid #282832;
            padding: 15px;
        }

        .channel-card:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            border-color: #e50914;
        }

        .channel-card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Botón de Favorito (Estrella) en la tarjeta */
        .fav-star {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.6);
            border: none;
            color: #888;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: color 0.2s, background 0.2s;
            z-index: 2;
        }

        .fav-star.active {
            color: #f5c518;
        }

        .fav-star:hover {
            color: #f5c518;
            background: rgba(0, 0, 0, 0.8);
        }

        /* Modal Reproductor */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            width: 100vw;
            height: 100vh;
            background: #18181c;
            border-radius: 0;
            border: none;
            box-shadow: none;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            padding: 12px 20px;
            background: #1f1f26;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2a32;
        }

        .modal-title {
            font-size: 1rem;
            font-weight: bold;
        }

        .modal-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-fullscreen {
            background: #e50914;
            border: none;
            color: #fff;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
        }

        .close-modal {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-body {
            position: relative;
            width: 100%;
            flex: 1;
            background: #000;
        }

        #bitmovin-player {
            width: 100%;
            height: 100%;
        }

        .bmpui-ui-watermark {
            display: none !important;
        }

        /* Modo reproducción directa por parámetro ?id= (sin barras) */
        body.direct-play header,
        body.direct-play .catalog-container,
        body.direct-play .modal-header {
            display: none !important;
        }

        body.direct-play .modal-overlay {
            opacity: 1;
            pointer-events: auto;
            background: #000;
        }

        body.direct-play .modal-content {
            width: 100vw;
            height: 100vh;
        }

        /* Botón flotante sutil para volver al catálogo en modo directo */
        .btn-exit-direct {
            /* display: none; */
            display: none !important;
            position: fixed;
            top: 14px;
            right: 14px;
            z-index: 200;
            background: rgba(20, 20, 24, 0.75);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        body.direct-play .btn-exit-direct {
            display: block;
        }

        body.direct-play:hover .btn-exit-direct {
            opacity: 1;
        }
    </style>

            grid.innerHTML = "";

            list.forEach(channel => {
                const isFav = favorites.includes(channel.id);
                const card = document.createElement("div");
                card.className = "channel-card";

                card.innerHTML = `
                    <button class="fav-star ${isFav ? 'active' : ''}" onclick="toggleFav(event, '${channel.id}')">★</button>
                    <img src="${channel.icono}" alt="Canal ${channel.id}" onerror="this.src='https://via.placeholder.com/150?text=TV'">
                `;

                card.onclick = (e) => {
                    if (e.target.tagName !== 'BUTTON') {
                        openModal(channel, true);
                    }
                };

                grid.appendChild(card);
            });
        }

        function enterFullscreen() {
            const target = document.getElementById('modalContent');
            if (player && typeof player.setFullscreen === 'function') {
                try {
                    player.setFullscreen(true);
                    return;
                } catch (_) {}
            }
            if (target.requestFullscreen) {
                target.requestFullscreen().catch(() => {});
            } else if (target.webkitRequestFullscreen) {
                target.webkitRequestFullscreen();
            }
        }

        function openModal(channel, requestFs = false) {
            document.getElementById('modalChannelTitle').innerText = `Canal: ${channel.id}`;
            document.getElementById('playerModal').classList.add('open');

            const proxiedUrl = `https://proxyplutotv.canalesonline24.workers.dev/?url=${encodeURIComponent(channel.url)}`;
            const playerContainer = document.getElementById('bitmovin-player');

            if (player) {
                player.destroy();
            }

            player = new bitmovin.player.Player(playerContainer, playerConfig);

            player.load({
                hls: proxiedUrl
            }).then(() => {
                if (requestFs) {
                    enterFullscreen();
                }
            }).catch(err => {
                console.error("Error al cargar el canal:", err);
            });

            document.getElementById("bitmovin-player").classList.remove("aspect-16x9");
        }

        function closeModal() {
            if (document.fullscreenElement && document.exitFullscreen) {
                document.exitFullscreen().catch(() => {});
            }
            document.getElementById('playerModal').classList.remove('open');
            if (player) {
                player.destroy();
                player = null;
            }
            if (document.body.classList.contains('direct-play')) {
                exitDirectMode();
            }
        }

        function exitDirectMode() {
            const url = new URL(window.location.href);
            url.searchParams.delete('id');
            window.history.replaceState({}, '', url.pathname + url.search);
            document.body.classList.remove('direct-play');
            if (player) {
                player.destroy();
                player = null;
            }
            document.getElementById('playerModal').classList.remove('open');
        }

        function toggleFav(event, channelId) {
            event.stopPropagation();
            if (favorites.includes(channelId)) {
                favorites = favorites.filter(id => id !== channelId);
            } else {
                favorites.push(channelId);
            }
            localStorage.setItem('iptv_favs', JSON.stringify(favorites));
            applyFilter();
        }

        function filterTab(tab) {
            currentFilter = tab;
            applyFilter();
        }

        function filterChannels() {
            applyFilter();
        }

        function applyFilter() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            let result = channels.filter(c => c.id.toLowerCase().includes(query));

            if (currentFilter === 'favs') {
                result = result.filter(c => favorites.includes(c.id));
            }

            renderGrid(result);
        }

        function checkUrlParamAndPlay() {
            const params = new URLSearchParams(window.location.search);
            const paramId = params.get('id');
            if (!paramId) return;

            document.body.classList.add('direct-play');

            const existing = channels.find(c => c.id === paramId);
            const targetChannel = existing || buildChannelObject(paramId);

            openModal(targetChannel, true);
        }

        // Render inicial
        renderGrid(channels);
        checkUrlParamAndPlay();
    </script>
</body>

</html>
