        * {

        html,

        :root {

        }

        .jw-button-container .jw-icon {
            color: var(--coloriconos) !important;
        }

            background-color: var(--colorbarra) !important;
        }

        .jw-icon:hover {
            color: var(--colorbarra) !important;
        }

        .jw-featured,
        .jw-rightclick {
            display: none !important;
        }

        /* Overlay futurista */
        .player-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .corner-frame {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 2px solid rgba(0, 255, 255, 0.5);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
            animation: pulse 2s ease-in-out infinite;
        }

        .corner-frame.top-left {
            top: 20px;
            left: 20px;
            border-right: none;
            border-bottom: none;
        }

        .corner-frame.top-right {
            top: 20px;
            right: 20px;
            border-left: none;
            border-bottom: none;
        }

        .corner-frame.bottom-left {
            bottom: 80px;
            left: 20px;
            border-right: none;
            border-top: none;
        }

        .corner-frame.bottom-right {
            bottom: 80px;
            right: 20px;
            border-left: none;
            border-top: none;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.5;
                box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
            }

            50% {
                opacity: 1;
                box-shadow: 0 0 25px rgba(0, 255, 255, 0.6);
            }
        }

        /* Canal info */
        .channel-info {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.1), rgba(0, 150, 255, 0.1));
            backdrop-filter: blur(10px);
            padding: 15px 40px;
            border-radius: 25px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            pointer-events: none;
            animation: slideDown 0.5s ease-out;
            z-index: 20;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .channel-name {
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #00ffff, #0099ff);
            /* -webkit-background-clip: text; */
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        /* Status indicator */
        .status-indicator {
            position: fixed;
            top: 30px;
            right: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 0, 0.3);
            pointer-events: none;
            z-index: 20;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #00ff00;
            box-shadow: 0 0 15px #00ff00;
            animation: blink 1.5s ease-in-out infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        .status-text {
            font-size: 14px;
            color: #00ff00;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Scan line effect */
        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.5), transparent);
            animation: scan 3s linear infinite;
            pointer-events: none;
        }

        @keyframes scan {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(100vh);
            }
        }

        /* Grid background effect */

        }

            font-size: 18px;
            color: #ffaaaa;
            line-height: 1.6;
            max-width: 600px;
        }
