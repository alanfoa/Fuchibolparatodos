        function getParam(name) {
            return new URL(window.location.href).searchParams.get(name);
        }

        function showError(msg) {
            document.getElementById('video').style.display = 'none';
            const el = document.getElementById('error-msg');
            el.style.display = 'block';
            el.innerHTML = `<h2>${msg}</h2>`;
        }

        async function init() {
            shaka.polyfill.installAll();

            if (!shaka.Player.isBrowserSupported()) {
                showError('Tu navegador no soporta este reproductor.');
                return;
            }

            const id = getParam('id');
            const config = canais[id];

            if (!config) {
                showError('Canal inválido o no encontrado.');
                return;
            }

            const url = config.url.startsWith('//') ? 'https:' + config.url : config.url;
            const video = document.getElementById('video');
            const player = new shaka.Player(video);

            // Exactamente igual al tester: clearKeys como { keyId: key }
            player.configure({
                drm: {
                    clearKeys: config.clearkey
                },
                abr: {
                    enabled: true,
                    defaultBandwidthEstimate: 8000000,
                },
                streaming: {
                    rebufferingGoal: 1,
                    bufferingGoal: 20,
                    defaultPresentationDelay: 2,
                },
                preferredAudioLanguage: 'es',
            });

            player.addEventListener('error', (e) => {
                console.error('Shaka error:', e.detail);
                showError(`Error al reproducir. (${e.detail.code})`);
            });

            try {
                await player.load(url);
                video.play().catch(() => { });
                try { player.selectAudioLanguage('es'); } catch (_) { }
            } catch (e) {
                console.error(e);
                showError(`No se pudo cargar el canal. (${e.message})`);
            }

            video.addEventListener('play', () => {
                try {
                    const liveEdge = player.seekRange().end;
                    video.currentTime = liveEdge;
                } catch (e) { }
            });
        }

        init();
