<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Plataforma IPTV - Canales</title>

<!-- hls.js: reproductor HLS gratuito, sin licencia -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>

<style>
  :root {
    --bg: #0e0e11;
    --panel: #141418;
    --card: #1d1d21;
    --line: #282832;
    --input: #25252b;
    --text: #ffffff;
    --muted: #888;
    --accent: #e50914;
    --star: #f5c518;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; flex-direction: column;
  }
  header {
    background: var(--panel); padding: 16px 24px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px;
    border-bottom: 1px solid #22222a; position: sticky; top: 0; z-index: 10;
  }
  .search-input {
    background: var(--input); border: 1px solid #3a3a45; padding: 10px 18px;
    border-radius: 20px; color: #fff; outline: none; width: 320px; max-width: 100%;
    font-size: .95rem; transition: border-color .3s;
  }
  .search-input:focus { border-color: var(--accent); }
  .btn {
    border: 1px solid #3a3a45; background: var(--input); color: #fff;
    padding: 10px 18px; border-radius: 20px; font-weight: bold; cursor: pointer;
    font-size: .9rem; transition: background .2s;
  }
  .btn:hover { background: #33333d; }
  .btn.active { background: var(--accent); border-color: var(--accent); }
  .btn.active:hover { background: #f40612; }

  .catalog-container { max-width: 1500px; margin: 0 auto; padding: 32px 20px; flex: 1; width: 100%; }
  .status-msg { text-align: center; color: var(--muted); font-size: 1.05rem; margin-top: 40px; line-height: 1.6; }
  .status-msg button { margin-top: 14px; }

  .guide { display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 10px; align-items: stretch; }
  .logo-cell {
    flex: 0 0 140px; height: 140px; background: var(--card); border-radius: 8px; position: relative;
    display: flex; align-items: center; justify-content: center; padding: 18px; cursor: pointer;
    font-size: .8rem; text-align: center; border: 2px solid transparent;
  }
  .logo-cell img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .fav-star {
    position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,.55); border: none; color: var(--muted);
    border-radius: 50%; width: 26px; height: 26px; cursor: pointer; font-size: .85rem; z-index: 2;
    display: flex; align-items: center; justify-content: center;
  }
  .fav-star.active, .fav-star:hover { color: var(--star); }
  .track-wrap { flex: 1; min-width: 0; position: relative; }
  .track-wrap .track { width: 100%; cursor: grab; }
  .track-wrap .track.dragging { cursor: grabbing; user-select: none; }
  .arrow {
    position: absolute; top: 0; bottom: 0; width: 64px; border: none; color: #fff; font-size: 2rem;
    cursor: pointer; z-index: 3; opacity: 0; transition: opacity .2s; display: flex; align-items: center;
  }
  .arrow[hidden] { display: none; }
  .arrow.left  { left: 0;  justify-content: flex-start; padding-left: 12px;  background: linear-gradient(90deg, rgba(14,14,17,.95), rgba(14,14,17,0)); }
  .arrow.right { right: 0; justify-content: flex-end;   padding-right: 12px; background: linear-gradient(270deg, rgba(14,14,17,.95), rgba(14,14,17,0)); }
  .track-wrap:hover .arrow, .arrow:focus-visible { opacity: 1; }
  @media (hover: none) { .arrow { display: none; } }
  .track { flex: 1; display: flex; gap: 10px; overflow-x: auto; min-width: 0; scrollbar-width: none; }
  .track::-webkit-scrollbar { display: none; }
  .prog {
    flex: 0 0 420px; height: 140px; background: var(--card); border-radius: 8px; overflow: hidden;
    display: flex; align-items: center; padding: 0 28px; cursor: pointer; border: 2px solid transparent;
  }
  .prog.live { flex: 0 0 660px; padding: 0; }
  .prog { position: relative; }
  .prog .thumb { flex: 0 0 245px; width: 245px; height: 100%; background: #000; position: relative; overflow: hidden; }
  .prog .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .prog .desc { color: #bbb; font-size: .9rem; margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .prog .name { padding-right: 34px; }
  .info-btn {
    position: absolute; top: 14px; right: 16px; width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid #ddd; background: transparent; color: #ddd; font: italic 700 .85rem Georgia, serif;
    cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 2;
  }
  .info-btn:hover { background: #fff; color: #000; }
  .prog.live .txt { padding: 0 28px; flex: 1; min-width: 0; }
  .prog .name { font-size: 1.15rem; font-weight: 700; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .prog .sub { color: #bbb; font-size: .95rem; margin-top: 8px; font-weight: 600; display: flex; align-items: center; gap: 14px; }
  .prog .bar { flex: 1; height: 3px; background: #4a4a52; border-radius: 2px; overflow: hidden; }
  .prog .bar > i { display: block; height: 100%; background: #fff; }
  .prog:hover, .prog:focus-visible, .logo-cell:hover, .logo-cell:focus-visible { border-color: var(--star); outline: none; }
  .empty-row { color: var(--muted); display: flex; align-items: center; padding: 0 20px; }
  @media (max-width: 700px) {
    .logo-cell { flex-basis: 84px; height: 110px; padding: 10px; }
    .prog { flex-basis: 70vw; height: 110px; padding: 0 16px; }
    .prog.live { flex-basis: 88vw; }
    .prog .thumb { flex-basis: 34%; }
    .prog .name { font-size: 1rem; }
  }
  .more-wrap { text-align: center; margin-top: 28px; }

  /* Reproductor */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 100;
    display: flex; opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal-content { width: 100%; height: 100%; background: #18181c; display: flex; flex-direction: column; }
  .modal-header {
    padding: 0px 20px; background: #1f1f26; border-bottom: 1px solid #2a2a32;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  .modal-title { font-size: 1rem; font-weight: bold; }
  .close-modal { background: transparent; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }
  .modal-body { position: relative; flex: 1; background: #000; min-height: 0; }
  #playerHost { position: absolute; inset: 0; background: #000; }
  #playerHost video { width: 100%; height: 100%; background: #000; }
  #playerMsg {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    text-align: center; padding: 24px; color: #ccc; line-height: 1.6; pointer-events: none;
  }
  /* Panel de programación */
  .sched-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 110; display: none;
    align-items: center; justify-content: center; padding: 16px;
  }
  .sched-overlay.open { display: flex; }
  .sched-box { background: #1b1b22; border: 1px solid var(--line); border-radius: 12px; width: 100%; max-width: 560px; max-height: 85vh; display: flex; flex-direction: column; }
  .sched-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); font-weight: bold; }
  .sched-list { overflow-y: auto; padding: 6px 0; }
  .sched-item { display: flex; gap: 14px; padding: 10px 18px; border-bottom: 1px solid #22222a; }
  .sched-list.no-scroll { scrollbar-width: none; }
  .sched-list.no-scroll::-webkit-scrollbar { display: none; }
  .sched-item.live { background: rgba(229,9,20,.12); border-left: 3px solid var(--accent); }
  .sched-item .t { color: var(--muted); font-size: .8rem; white-space: nowrap; min-width: 92px; }
  .sched-item .n { font-weight: 600; font-size: .92rem; }
  .sched-item .e { color: #aaa; font-size: .8rem; margin-top: 2px; }
  .sched-note { padding: 10px 18px; color: var(--muted); font-size: .78rem; border-top: 1px solid var(--line); }
  
  /* ===== Móvil ===== */
  .close-modal { padding: 0px 10px; }
  @media (max-width: 700px) {
    header { padding: 10px 12px; padding-top: calc(10px + env(safe-area-inset-top)); gap: 8px; }
    .search-input { flex: 1 1 100%; width: 100%; font-size: 16px; }
    header .btn { flex: 1; padding: 10px 12px; }
    .catalog-container { padding: 12px 10px calc(16px + env(safe-area-inset-bottom)); }
    .guide, .row, .track { gap: 8px; }
    .logo-cell { flex-basis: 76px; height: 96px; padding: 8px; font-size: .7rem; }
    .fav-star { width: 26px; height: 26px; top: 4px; right: 4px; }
    .track { scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
    .prog { flex-basis: 64vw; height: 96px; padding: 0 14px; scroll-snap-align: start; }
    .prog.live { flex-basis: 84vw; padding: 0; }
    .prog .thumb { flex-basis: 36%; width: 36%; }
    .prog .desc { display: none; }
    .info-btn { top: 8px; right: 8px; width: 22px; height: 22px; font-size: .75rem; }
    .prog .name { padding-right: 26px; }
    .prog.live .txt { padding: 0 12px; }
    .prog .name { font-size: .95rem; }
    .prog .sub { font-size: .8rem; gap: 8px; margin-top: 6px; }
    .modal-content { height: 100dvh; }
    .modal-header { padding: 0px 14px; padding-top: calc(10px + env(safe-area-inset-top)); }
    .modal-title { font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sched-overlay { align-items: flex-end; padding: 0; }
    .sched-box { max-width: none; border-radius: 16px 16px 0 0; max-height: 80dvh; padding-bottom: env(safe-area-inset-bottom); }
    .sched-item { padding: 12px 14px; }
    .sched-item .t { min-width: 78px; }
  }
</style>
<link rel="stylesheet" href="style-jw.css">
</head>
<body>

<header>
  <input type="text" class="search-input" id="searchInput" placeholder="Buscar canal o programa...">
  <button class="btn active" id="tabAll">Todos</button>
  <button class="btn" id="tabFavs">⭐ Favoritos</button>
</header>

<main class="catalog-container">
  <div id="statusMsg" class="status-msg">Cargando canales...</div>
  <div class="guide" id="gridChannels"></div>
  <div class="more-wrap"><button class="btn" id="moreBtn" style="display:none">Cargar más</button></div>
</main>

<div class="sched-overlay" id="schedModal">
  <div class="sched-box">
    <div class="sched-head"><span id="schedTitle">Programación</span><button class="close-modal" id="schedClose" aria-label="Cerrar">✕</button></div>
    <div class="sched-list" id="schedList"></div>
    <div class="sched-note" id="schedNote"></div>
  </div>
</div>

<div class="modal-overlay" id="playerModal">
  <div class="modal-content">
    <div class="modal-header">
      <span class="modal-title" id="modalChannelTitle">Reproduciendo</span>
      <button class="close-modal" id="closeBtn" aria-label="Cerrar">✕</button>
    </div>
    <div class="modal-body">
      <div id="playerHost"></div>
      <div id="playerMsg"></div>
    </div>
  </div>
</div>

<script>
/* ================= CONFIGURACIÓN ================= */
const WORKER_PROXY   = "https://pluto.lalore2925.workers.dev/?url=";           // proxy CORS para la API
const STREAM_PROXY   = "https://proxyplutotv.canalesonline24.workers.dev/";   // proxy para los .m3u8
const PAGE_URL       = "https://pluto.tv/latam/watch/live-tv/";                // página HTML (no depende del buildId)
const STREAM_BASE    = "https://jmp2.uk/plu-";                                 // + id + ".m3u8"
const GUIDE_API      = "https://service-channels.clusters.pluto.tv/v2/guide/timelines"; // guía completa por canal
const GUIDE_WORKER   = "https://proxyplutoguia.canalesonline24.workers.dev/";   // Worker de guía completa (worker-guia.js)
const JW_LIBRARY     = "https://ssl.p.jwpcdn.com/player/v/8.26.0/jwplayer.js";   // librería de JW Player 8.26.0
const JW_KEY         = "XSuP4qMl+9tK17QNb+4+th2Pm9AWgMO/cYH8CI0HGGr7bdjo";   // tu licencia de JW Player
const PAGE_SIZE      = Infinity;   // carga todos los canales de una vez                                                     // canales visibles por tanda
const FAV_KEY        = "iptv_favs";

/* ================= ESTADO ================= */
let channels = [];
let favorites = loadFavs();
let currentFilter = "all";
let visibleCount = PAGE_SIZE;
let hls = null;
let jw = null;
let playToken = 0;

const $ = id => document.getElementById(id);

function loadFavs() {
  try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch { return []; }
}
function saveFavs() {
  try { localStorage.setItem(FAV_KEY, JSON.stringify(favorites)); } catch {}
}

/* ================= CARGA DE CANALES ================= */
// Obtiene el JSON de la página leyendo __NEXT_DATA__ (no depende del buildId de /_next/data/)
async function fetchPageProps() {
  const res = await fetch(WORKER_PROXY + encodeURIComponent(PAGE_URL));
  if (!res.ok) throw new Error("El Worker respondió con estado " + res.status);
  const html = await res.text();
  const m = html.match(/<script id="__NEXT_DATA__"[^>]*>([\s\S]*?)<\/script>/);
  if (!m) throw new Error("No se encontró __NEXT_DATA__ (el Worker devolvió algo que no es la página de Pluto)");
  const data = JSON.parse(m[1]);
  return data.props?.pageProps || data.pageProps || {};
}

function extractChannels(pageProps) {
  const out = [];
  const seen = new Set();
  const queries = pageProps.dehydratedState?.queries || [];
  queries.forEach(q => {
    const items = q.state?.data?.items;
    if (!Array.isArray(items)) return;
    items.forEach(item => {
      const id = item.videoContentId;
      if (!id || seen.has(id)) return;
      seen.add(id);
      out.push({
        id,
        name: item.channelName || ("Canal " + id),
        listings: [...(item.currentListing || []), ...(item.upcomingListing || [])],
        url: STREAM_BASE + id + ".m3u8",
        icono: item.resolvedfilePathLogo || item.resolvedfilePathLogoSelected ||
               ("https://images.pluto.tv/channels/" + id + "/colorLogoPNG.png"),
        iconoColor: item.resolvedfilePathLogoSelected ||
               ("https://images.pluto.tv/channels/" + id + "/colorLogoPNG.png")
      });
    });
  });
  return out;
}

// Busca en un objeto cualquier ruta de imagen cuyo nombre/valor encaje con el patrón (p. ej. 16_9 = horizontal)
function findImage(obj, pattern, depth = 0) {
  if (!obj || typeof obj !== "object" || depth > 4) return "";
  for (const [k, v] of Object.entries(obj)) {
    if (typeof v === "string" && /\.(jpe?g|png|webp)(\?|$)/i.test(v) && pattern.test(k + " " + v)) return v;
  }
  for (const v of Object.values(obj)) {
    if (v && typeof v === "object") { const r = findImage(v, pattern, depth + 1); if (r) return r; }
  }
  return "";
}
function imgUrl(path) {
  if (!path) return "";
  if (/^https?:/i.test(path)) return path;
  return "https://wwwimage-us.plutostatic.tv/thumbnails/photos/w400-q80/" +
         path.replace(/^\/?files\//, "").replace(/^\//, "") + "?format=webp";
}
const LANDSCAPE = /16_9|16x9|landscape|screenshot|hero/i;

// Imágenes candidatas del programa, de la más parecida a la oficial (poster 16:9) a la menos
function thumbs(t) {
  const ep = t.episode || {};
  const epId = ep._id || ep.id;
  const cands = [
    findImage(ep, /poster16_9/i) || findImage(t, /poster16_9/i),
    epId ? "https://images.pluto.tv/episodes/" + epId + "/poster16_9.jpg" : "",
    findImage(ep, LANDSCAPE) || findImage(t, LANDSCAPE),
    findImage(ep, /./)
  ].map(imgUrl).filter((u, i, a) => u && a.indexOf(u) === i);
  return { resolvedfilePathThumb: cands[0] || "", thumbFallbacks: cands.slice(1) };
}

// Guía completa: todos los canales + programación desde tu Worker
async function loadFromGuideWorker() {
  const res = await fetch(GUIDE_WORKER);
  const json = await res.json();
  if (!res.ok || json.error) throw new Error("Worker de guía (" + (json.step || res.status) + "): " + (json.error || "error"));
  return (json.channels || []).map(c => {
    const logo = (c.images || []).find(i => /solidLogo/i.test(i.type || ""))?.url ||
                 (c.images || []).find(i => /colorLogo/i.test(i.type || ""))?.url;
    return {
      id: c.id,
      name: c.name || ("Canal " + c.id),
      url: STREAM_BASE + c.id + ".m3u8",
      icono: logo || ("https://images.pluto.tv/channels/" + c.id + "/colorLogoPNG.png"),
      iconoColor: (c.images || []).find(i => /colorLogo/i.test(i.type || ""))?.url ||
                  ("https://images.pluto.tv/channels/" + c.id + "/colorLogoPNG.png"),
      listings: ((json.timelines || {})[c.id] || []).map(t => ({
        startTimestamp: Date.parse(t.start),
        endTimestamp: Date.parse(t.stop),
        title: t.title || t.episode?.series?.name || "",
        episodeTitle: t.episode?.name || t.title || "",
        entityType: t.episode?.series?.type === "movie" ? "movie" : "show",
        description: t.episode?.description || t.description || t.episode?.series?.description || "",
        ...thumbs(t)
      }))
    };
  });
}

async function loadChannels() {
  const status = $("statusMsg");
  status.style.display = "block";
  status.textContent = "Cargando canales...";
  try {
    if (GUIDE_WORKER) {
      try { channels = await loadFromGuideWorker(); }
      catch (e) { console.warn("Guía completa falló, uso la página de Pluto:", e.message); channels = []; }
    }
    if (!channels.length) channels = extractChannels(await fetchPageProps());
    if (!channels.length) throw new Error("No se encontraron canales en la respuesta");
    status.style.display = "none";
    applyFilter();
  } catch (err) {
    console.error("Error al cargar canales:", err);
    status.innerHTML = "No se pudieron cargar los canales.<br><small>" +
      escapeHtml(err.message) + "</small><br><button class='btn' id='retryBtn'>Reintentar</button>";
    $("retryBtn").onclick = loadChannels;
  }
}

/* ================= RENDER ================= */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

// Programa en emisión según la hora actual (usa currentListing + upcomingListing)
function nowListing(ch) {
  const now = Date.now();
  return ch.listings.find(l => l.startTimestamp <= now && now < l.endTimestamp) || null;
}
const fmtTime = ts => new Date(ts).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
function fmtRemaining(ms) {
  const mins = Math.max(1, Math.ceil(ms / 60000));
  const h = Math.floor(mins / 60), m = mins % 60;
  return (h ? h + "h " : "") + m + "m restante";
}
function progTitle(l) {
  return l.entityType === "show" && l.title && l.episodeTitle && l.episodeTitle !== l.title
    ? l.title + " · " + l.episodeTitle : (l.episodeTitle || l.title || "Sin título");
}

/* ====== PROGRAMACIÓN POR ID ======
   getSchedule("ID")  -> devuelve { source, items:[{start,end,title,subtitle}] }
   showSchedule("ID") -> abre el panel con la programación
   Usable desde la consola:  showSchedule("5dcde437229eff00091b6c30")      */
async function getSchedule(id, hours = 12) {
  const ch = channels.find(c => c.id === id);
  try {
    const start = new Date(Date.now() - 30 * 60000).toISOString();
    const api = GUIDE_API + "?start=" + encodeURIComponent(start) +
                "&channelIds=" + encodeURIComponent(id) + "&duration=" + (hours * 60);
    const res = await fetch(WORKER_PROXY + encodeURIComponent(api));
    if (!res.ok) throw new Error("HTTP " + res.status);
    const json = await res.json();
    const entry = (json.data || []).find(d => d.channelId === id) || (json.data || [])[0];
    const tl = entry && entry.timelines;
    if (!Array.isArray(tl) || !tl.length) throw new Error("respuesta sin programación");
    return {
      source: "guide",
      items: tl.map(t => ({
        start: new Date(t.start).getTime(),
        end: new Date(t.stop).getTime(),
        title: t.title || t.episode?.series?.name || "Sin título",
        subtitle: t.episode?.name && t.episode.name !== t.title ? t.episode.name : ""
      }))
    };
  } catch (err) {
    console.warn("Guía completa no disponible, uso datos locales:", err.message);
    if (!ch) throw new Error("Canal no encontrado: " + id);
    return {
      source: "local",
      items: ch.listings.map(l => ({
        start: l.startTimestamp, end: l.endTimestamp,
        title: l.title || l.episodeTitle,
        subtitle: l.episodeTitle && l.episodeTitle !== l.title ? l.episodeTitle : ""
      }))
    };
  }
}

function showDetail(ch, l) {
  $("schedTitle").textContent = progTitle(l);
  const list = $("schedList");
  list.className = "sched-list no-scroll";
  list.textContent = "";
  list.style.padding = "18px";
  const srcs = [l.resolvedfilePathThumb, ...(l.thumbFallbacks || [])].filter(Boolean);
  if (srcs.length) {
    const cover = document.createElement("img");
    let n = 0;
    cover.alt = "";
    cover.style.cssText = "display:block;width:100%;aspect-ratio:16/9;max-height:34vh;object-fit:cover;border-radius:8px;margin-bottom:14px;background:#000";
    cover.onerror = () => { if (++n < srcs.length) cover.src = srcs[n]; else cover.remove(); };
    cover.src = srcs[0];
    list.appendChild(cover);
  }
  const t = document.createElement("div");
  t.style.cssText = "color:#888;font-size:.85rem;margin-bottom:12px";
  t.textContent = fmtTime(l.startTimestamp) + " – " + fmtTime(l.endTimestamp);
  const d = document.createElement("div");
  d.style.lineHeight = "1.55";
  d.textContent = l.description || "Sin descripción disponible.";
  list.append(t, d);
  $("schedNote").textContent = ch.name;
  $("schedModal").classList.add("open");
}

async function showSchedule(id) {
  const ch = channels.find(c => c.id === id);
  $("schedTitle").textContent = "Programación — " + (ch ? ch.name : id);
  const list = $("schedList"), note = $("schedNote");
  list.className = "sched-list";
  list.textContent = "Cargando...";
  list.style.padding = "18px";
  note.textContent = "";
  $("schedModal").classList.add("open");
  try {
    const { source, items } = await getSchedule(id);
    const now = Date.now();
    const upcoming = items.filter(i => i.end > now).sort((a, b) => a.start - b.start);
    list.textContent = "";
    list.style.padding = "6px 0";
    if (!upcoming.length) { list.textContent = "Sin programación disponible."; list.style.padding = "18px"; return; }
    upcoming.forEach(i => {
      const row = document.createElement("div");
      row.className = "sched-item" + (i.start <= now ? " live" : "");
      const t = document.createElement("div"); t.className = "t";
      t.textContent = fmtTime(i.start) + " – " + fmtTime(i.end);
      const body = document.createElement("div");
      const n = document.createElement("div"); n.className = "n";
      n.textContent = (i.start <= now ? "● En vivo: " : "") + i.title;
      body.appendChild(n);
      if (i.subtitle) { const e = document.createElement("div"); e.className = "e"; e.textContent = i.subtitle; body.appendChild(e); }
      row.append(t, body);
      list.appendChild(row);
    });
    note.textContent = source === "local"
      ? "Mostrando solo los próximos programas de la página (la guía completa no respondió)."
      : "Guía completa de las próximas horas.";
  } catch (err) {
    list.textContent = "No se pudo cargar la programación: " + err.message;
    list.style.padding = "18px";
  }
}
window.getSchedule = getSchedule;
window.showSchedule = showSchedule;

function buildTrack(ch) {
  const now = Date.now();
  const track = document.createElement("div");
  track.className = "track";
  const items = ch.listings.filter(l => l.endTimestamp > now).sort((a, b) => a.startTimestamp - b.startTimestamp);
  if (!items.length) {
    const e = document.createElement("div");
    e.className = "empty-row";
    e.textContent = "Programación no disponible";
    track.appendChild(e);
    return track;
  }
  items.forEach(l => {
    const live = l.startTimestamp <= now;
    const el = document.createElement("div");
    el.className = "prog" + (live ? " live" : "");
    el.tabIndex = 0;
    const txt = document.createElement("div");
    if (live) {
      const thumb = document.createElement("div");
      thumb.className = "thumb";
      const srcs = [l.resolvedfilePathThumb, ...(l.thumbFallbacks || [])].filter(Boolean);
      if (srcs.length) {
        const im = document.createElement("img");
        let n = 0;
        im.loading = "lazy";
        im.alt = "";
        im.onerror = () => { if (++n < srcs.length) im.src = srcs[n]; else im.remove(); };
        im.src = srcs[0];
        thumb.appendChild(im);
      }
      el.appendChild(thumb);
      txt.className = "txt";
    }
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = progTitle(l);
    const sub = document.createElement("div");
    sub.className = "sub";
    if (live) {
      const rem = document.createElement("span");
      rem.textContent = fmtRemaining(l.endTimestamp - now);
      const bar = document.createElement("div");
      bar.className = "bar";
      const fill = document.createElement("i");
      fill.style.width = Math.min(100, Math.max(0, (now - l.startTimestamp) / (l.endTimestamp - l.startTimestamp) * 100)) + "%";
      bar.appendChild(fill);
      sub.append(rem, bar);
    } else {
      sub.textContent = fmtTime(l.startTimestamp);
    }
    txt.appendChild(name);
    if (l.description) {
      const desc = document.createElement("div");
      desc.className = "desc";
      desc.textContent = l.description;
      txt.appendChild(desc);
    }
    txt.appendChild(sub);
    el.appendChild(txt);
    const info = document.createElement("button");
    info.className = "info-btn";
    info.textContent = "i";
    info.setAttribute("aria-label", "Más información");
    info.onclick = e => { e.stopPropagation(); showDetail(ch, l); };
    el.appendChild(info);
    const action = () => live ? openModal(ch) : showSchedule(ch.id);
    el.onclick = action;
    el.onkeydown = e => { if (e.key === "Enter") action(); };
    track.appendChild(el);
  });
  return track;
}

/* ====== Navegación horizontal de cada fila ====== */
function updateArrows(wrap) {
  if (!wrap) return;
  const t = wrap.querySelector(".track");
  wrap.querySelector(".arrow.left").hidden  = t.scrollLeft <= 4;
  wrap.querySelector(".arrow.right").hidden = t.scrollLeft + t.clientWidth >= t.scrollWidth - 4;
}

let drag = null, justDragged = false;
window.addEventListener("mousemove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.startX;
  if (Math.abs(dx) > 5) { drag.moved = true; drag.track.classList.add("dragging"); }
  if (drag.moved) drag.track.scrollLeft = drag.startLeft - dx;
});
window.addEventListener("mouseup", () => {
  if (!drag) return;
  drag.track.classList.remove("dragging");
  justDragged = drag.moved;
  drag = null;
});

function buildTrackWrap(ch) {
  const wrap = document.createElement("div");
  wrap.className = "track-wrap";
  const mk = (dir, txt, label) => {
    const b = document.createElement("button");
    b.className = "arrow " + dir;
    b.textContent = txt;
    b.setAttribute("aria-label", label);
    b.onclick = () => {
      const t = wrap.querySelector(".track");
      t.scrollBy({ left: (dir === "left" ? -1 : 1) * t.clientWidth * 0.8, behavior: "smooth" });
    };
    return b;
  };
  wrap.append(mk("left", "‹", "Anterior"), buildTrack(ch), mk("right", "›", "Siguiente"));

  // Actualiza flechas al hacer scroll (scroll no burbujea: se usa captura)
  wrap.addEventListener("scroll", () => updateArrows(wrap), true);

  // Arrastrar con el mouse (estado global, ver initDrag)
  wrap.addEventListener("mousedown", e => {
    if (e.button !== 0 || e.target.closest(".arrow")) return;
    const t = wrap.querySelector(".track");
    drag = { track: t, startX: e.clientX, startLeft: t.scrollLeft, moved: false };
  });
  // Si fue un arrastre, no abrir el reproductor / la guía
  wrap.addEventListener("click", e => {
    if (justDragged) { e.stopPropagation(); e.preventDefault(); justDragged = false; }
  }, true);

  requestAnimationFrame(() => updateArrows(wrap));
  return wrap;
}

function refreshNow() {
  document.querySelectorAll(".row").forEach(row => {
    const ch = channels.find(c => c.id === row.dataset.id);
    if (!ch) return;
    const old = row.querySelector(".track");
    const fresh = buildTrack(ch);
    const left = old.scrollLeft;
    old.replaceWith(fresh);
    fresh.scrollLeft = left;
    updateArrows(row.querySelector(".track-wrap"));
  });
}
setInterval(refreshNow, 30000);

function renderGrid(list) {
  const grid = $("gridChannels");
  grid.innerHTML = "";
  list.slice(0, visibleCount).forEach(ch => {
    const row = document.createElement("div");
    row.className = "row";
    row.dataset.id = ch.id;

    const cell = document.createElement("div");
    cell.className = "logo-cell";
    cell.tabIndex = 0;
    cell.title = ch.name;
    const star = document.createElement("button");
    star.className = "fav-star" + (favorites.includes(ch.id) ? " active" : "");
    star.textContent = "★";
    star.setAttribute("aria-label", "Favorito");
    star.onclick = e => { e.stopPropagation(); toggleFav(ch.id); };
    const img = document.createElement("img");
    img.src = ch.icono;
    img.alt = ch.name;
    img.loading = "lazy";
    let colorBad = false;
    // Si falla la versión a color vuelve a la sólida; si falla la sólida muestra el nombre
    img.onerror = () => {
      if (img.dataset.state === "color") { colorBad = true; img.dataset.state = "solid"; img.src = ch.icono; return; }
      img.onerror = null;
      img.replaceWith(document.createTextNode(ch.name));
    };
    const toColor = () => { if (!colorBad && ch.iconoColor && img.dataset.state !== "color") { img.dataset.state = "color"; img.src = ch.iconoColor; } };
    const toSolid = () => { if (img.dataset.state === "color") { img.dataset.state = "solid"; img.src = ch.icono; } };
    cell.addEventListener("mouseenter", toColor);
    cell.addEventListener("mouseleave", toSolid);
    cell.addEventListener("focus", toColor);
    cell.addEventListener("blur", toSolid);
    cell.append(star, img);
    cell.onclick = () => openModal(ch);
    cell.onkeydown = e => { if (e.key === "Enter") openModal(ch); };

    row.append(cell, buildTrackWrap(ch));
    grid.appendChild(row);
  });

  $("moreBtn").style.display = list.length > visibleCount ? "inline-block" : "none";

  const status = $("statusMsg");
  if (!list.length && channels.length) {
    status.style.display = "block";
    status.textContent = currentFilter === "favs" ? "Todavía no marcaste favoritos." : "No hay canales que coincidan.";
  } else if (channels.length) {
    status.style.display = "none";
  }
}

function applyFilter() {
  const q = $("searchInput").value.trim().toLowerCase();
  let result = channels.filter(c => {
    if (c.name.toLowerCase().includes(q)) return true;
    const l = nowListing(c);
    return l && ((l.title || "") + " " + (l.episodeTitle || "")).toLowerCase().includes(q);
  });
  if (currentFilter === "favs") result = result.filter(c => favorites.includes(c.id));
  renderGrid(result);
}

function toggleFav(id) {
  favorites = favorites.includes(id) ? favorites.filter(f => f !== id) : [...favorites, id];
  saveFavs();
  applyFilter();
}

function setTab(tab) {
  currentFilter = tab;
  visibleCount = PAGE_SIZE;
  $("tabAll").classList.toggle("active", tab === "all");
  $("tabFavs").classList.toggle("active", tab === "favs");
  applyFilter();
}

/* ================= REPRODUCTOR (JW Player; hls.js como respaldo) ================= */
let jwLoading = null;
function loadJW() {
  if (window.jwplayer) return Promise.resolve(true);
  if (!JW_LIBRARY) return Promise.resolve(false);
  if (!jwLoading) jwLoading = new Promise(res => {
    const sc = document.createElement("script");
    sc.src = JW_LIBRARY;
    sc.onload = () => { if (JW_KEY && window.jwplayer) window.jwplayer.key = JW_KEY; res(!!window.jwplayer); };
    sc.onerror = () => { console.warn("No se pudo cargar la librería de JW Player"); res(false); };
    document.head.appendChild(sc);
  });
  return jwLoading;
}

function showPlayerMsg(text) {
  const el = $("playerMsg");
  el.textContent = text;
  el.style.display = text ? "flex" : "none";
}

function destroyPlayer() {
  playToken++;
  if (jw) { try { jw.remove(); } catch (e) {} jw = null; }
  if (hls) { hls.destroy(); hls = null; }
  const host = $("playerHost");
  const v = host.querySelector("video");
  if (v) { v.pause(); v.removeAttribute("src"); v.load(); }
  host.innerHTML = "";
  showPlayerMsg("");
}

function startJW(ch, src, token) {
  const host = $("playerHost");
  host.innerHTML = '<div id="jwplayer"></div>';
  try {
    jw = window.jwplayer("jwplayer").setup({
      playlist: [{ title: ch.name, sources: [{ file: src, type: "hls" }] }],
      autostart: true,
      width: "100%",
      height: "100%",
      stretching: "uniform"
    });
    jw.on("setupError", e => {
      console.warn("JW Player no se pudo iniciar, uso hls.js:", e && e.message);
      if (token !== playToken) return;
      try { jw.remove(); } catch (x) {}
      jw = null;
      startHls(src);
    });
    jw.on("error", e => {
      console.error("Error JW Player:", e);
      if (token === playToken) showPlayerMsg("No se pudo cargar el canal. Puede estar caído o bloqueado por región.");
    });
  } catch (err) {
    console.warn("JW Player falló, uso hls.js:", err.message);
    startHls(src);
  }
}

function startHls(src) {
  const host = $("playerHost");
  host.innerHTML = '<video controls autoplay playsinline></video>';
  const video = host.querySelector("video");
  if (window.Hls && Hls.isSupported()) {
    hls = new Hls({ lowLatencyMode: false });
    hls.loadSource(src);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
    hls.on(Hls.Events.ERROR, (_, data) => {
      if (!data.fatal) return;
      console.error("Error HLS:", data);
      if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
        showPlayerMsg("No se pudo cargar el canal. Puede estar caído o bloqueado por región.");
        hls.destroy(); hls = null;
      } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
        hls.recoverMediaError();
      } else {
        showPlayerMsg("Error de reproducción.");
        hls.destroy(); hls = null;
      }
    });
  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = src; // Safari / iOS
    video.play().catch(() => {});
  } else {
    showPlayerMsg("Tu navegador no soporta reproducción HLS.");
  }
}

async function openModal(ch) {
  const l = nowListing(ch);
  $("modalChannelTitle").textContent = ch.name + (l ? " — " + (l.episodeTitle || l.title) : "");
  $("playerModal").classList.add("open");
  destroyPlayer();
  const token = playToken;
  const src = STREAM_PROXY + "?url=" + encodeURIComponent(ch.url);

  const hasJW = await loadJW();
  if (token !== playToken) return;       // se cerró o se cambió de canal mientras cargaba
  if (hasJW) startJW(ch, src, token);
  else startHls(src);
}

function closeModal() {
  $("playerModal").classList.remove("open");
  destroyPlayer();
}

/* ================= EVENTOS ================= */
$("searchInput").addEventListener("input", () => { visibleCount = PAGE_SIZE; applyFilter(); });
$("tabAll").onclick  = () => setTab("all");
$("tabFavs").onclick = () => setTab("favs");
$("moreBtn").onclick = () => { visibleCount += PAGE_SIZE; applyFilter(); };
$("closeBtn").onclick = closeModal;
$("schedClose").onclick = () => $("schedModal").classList.remove("open");
$("schedModal").addEventListener("click", e => { if (e.target.id === "schedModal") $("schedModal").classList.remove("open"); });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if ($("schedModal").classList.contains("open")) $("schedModal").classList.remove("open");
  else closeModal();
});

loadChannels();
</script>
