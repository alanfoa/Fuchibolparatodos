    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --accent-color: #e50914;
            --text-color: #ffffff;
            --text-secondary: #a0a0a0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2.2rem;
        }

        .controls {
            display: flex;
            /* flex-wrap: wrap; */
            gap: 15px;
            justify-content: center;
            margin-bottom: 25px;
        }

        #search-bar {
            width: 100%;
            max-width: 400px;
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid #333;
            background-color: #2a2a32;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
        }

        #search-bar:focus {
            border-color: var(--accent-color);
        }

        .filter-btn {
            background-color: #2a2a32;
            color: var(--text-color);
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background-color: var(--accent-color);
        }

        /* Grid de Canales */
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .channel-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .channel-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        .channel-logo {
            width: 100%;
            height: 100px;
            object-fit: contain;
            margin-bottom: 12px;
        }

        .channel-name {
            font-size: 0.95rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 5px;
            line-height: 1.2;
        }

        .channel-group {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .fav-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.6);
            border: none;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .fav-btn.active {
            color: #ffca28;
        }

        /* Modal JWPlayer 100% Pantalla */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 9999;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            color: #fff;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10000;
            background: rgba(0, 0, 0, 0.6);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            transition: 0.2s;
        }

        .close-btn:hover {
            background: rgba(229, 9, 20, 0.8);
        }

        #jwplayer-container {
            width: 100% !important;
            height: 100% !important;
        }
    </style>

        let channels = [];
        let favorites = JSON.parse(localStorage.getItem('pluto_favs')) || [];
        let playerInstance = null;
        let currentFilterGroup = 'ALL';

        // Parsear M3U
        function parseM3U(data) {
            const lines = data.split('\n');
            const result = [];
            let currentChannel = {};

            lines.forEach((line) => {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const idMatch = line.match(/tvg-id="([^"]+)"/);
                    const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                    const groupMatch = line.match(/group-title="([^"]+)"/);
                    const nameParts = line.split(',');

                    currentChannel = {
                        id: idMatch ? idMatch[1] : Math.random().toString(),
                        logo: logoMatch ? logoMatch[1] : '',
                        group: groupMatch ? groupMatch[1] : 'VARIOS',
                        name: nameParts[nameParts.length - 1].trim()
                    };
                } else if (line.startsWith('http')) {
                    currentChannel.url = line;
                    result.push(currentChannel);
                    currentChannel = {};
                }
            });
            return result;
        }

        // Renderizar Canales
        function renderChannels(channelList) {
            const container = document.getElementById('channels-container');
            container.innerHTML = '';

            if (channelList.length === 0) {
                container.innerHTML = `<p style="grid-column: 1/-1; text-align: center;">No se encontraron canales.</p>`;
                return;
            }

            channelList.forEach(channel => {
                const isFav = favorites.includes(channel.id);
                const card = document.createElement('div');
                card.className = 'channel-card';
                card.onclick = (e) => {
                    if (!e.target.classList.contains('fav-btn')) {
                        openPlayer(channel.url);
                    }
                };

                card.innerHTML = `
                    <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite('${channel.id}', event)">
                        ★
                    </button>
                    <img class="channel-logo" src="${channel.logo}" alt="${channel.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/150x100?text=Sin+Logo'">
                    <div class="channel-name">${channel.name}</div>
                    <div class="channel-group">${channel.group}</div>
                `;
                container.appendChild(card);
            });
        }

        // Alternar Favoritos
        function toggleFavorite(id, event) {
            event.stopPropagation();
            if (favorites.includes(id)) {
                favorites = favorites.filter(favId => favId !== id);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('pluto_favs', JSON.stringify(favorites));
            applyFilters();
        }

        // Filtrar Canales
        function applyFilters() {
            const searchTerm = document.getElementById('search-bar').value.toLowerCase();

            const filtered = channels.filter(channel => {
                const matchesSearch = channel.name.toLowerCase().includes(searchTerm) || channel.group.toLowerCase().includes(searchTerm);
                const matchesFav = currentFilterGroup === 'FAV' ? favorites.includes(channel.id) : true;
                return matchesSearch && matchesFav;
            });

            renderChannels(filtered);
        }

        function filterGroup(group, event) {
            currentFilterGroup = group;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            applyFilters();
        }


        // Funciones del Reproductor JWPlayer
        async function openPlayer(streamUrl) {
            document.getElementById("videoModal").style.display = "block";

            // Pedirle al worker que resuelva la redirección de jmp2.uk a stitcher.pluto.tv
            let realStreamUrl = streamUrl;
            try {
                const res = await fetch("https://proxy-plutotv.canalesonline24.workers.dev/?mode=redirect&url=" + encodeURIComponent(streamUrl));
                if (res.ok) {
                    realStreamUrl = await res.text(); // Devuelve https://stitcher-ipv4.pluto.tv/...
                }
            } catch (e) {
                console.error("No se pudo resolver la redirección:", e);
            }

            // Le pasamos la URL de Pluto TV envuelta en el proxy a JW Player
            const finalProxyUrl = "https://proxy-plutotv.canalesonline24.workers.dev/?url=" + encodeURIComponent(realStreamUrl);

            if (!playerInstance) {
                playerInstance = jwplayer("jwplayer-container").setup({
                    file: finalProxyUrl,
                    width: "100%",
                    height: "100%",
                    autostart: true,
                    type: "hls"
                });
            } else {
                playerInstance.load([{
                    file: finalProxyUrl,
                    type: "hls"
                }]);
                playerInstance.play();
            }
        }

        function closePlayer() {
            document.getElementById("videoModal").style.display = "none";
            if (playerInstance) {
                playerInstance.pause();
            }
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            channels = parseM3U(m3uRawData);
            renderChannels(channels);

            document.getElementById('search-bar').addEventListener('input', applyFilters);

            // Tecla Escape para salir del modal
            document.addEventListener('keydown', (e) => {
                if (e.key === "Escape") {
                    closePlayer();
                }
            });
        });
    </script>
