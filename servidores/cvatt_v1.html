<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="noindex, nofollow, noarchive" name="robots" />
  <meta name="referrer" content="no-referrer" />
  <title>cvattv v1</title>
  <style>
    html,
    body,
    #player {
      width: 100% !important;
      height: 100% !important;
      margin: 0;
      padding: 0;
      background-color: black;
      color: white;
    }

    :root {
      --colorbarra: #51E0C0;
      --coloriconos: #f0f0f0;
    }

    .jw-button-container .jw-icon {
      color: var(--coloriconos) !important;
    }

    .jw-slider-container .jw-progress {
      background-color: var(--colorbarra) !important;
    }

    .jw-icon:hover {
      color: var(--colorbarra) !important;
    }

    .jw-featured,
    .jw-rightclick {
      display: none !important;
    }
  </style>
  <link rel="stylesheet" href="style-jw.css">

  <!-- JW Player -->
    <script src="//ssl.p.jwpcdn.com/player/v/8.26.0/jwplayer.js"></script>
    <script>jwplayer.key = "XSuP4qMl+9tK17QNb+4+th2Pm9AWgMO/cYH8CI0HGGr7bdjo";</script>
</head>

<body>
  <div id="player" class="ViostreamIframe"></div>

  <script>
    function getParameterByName(name) {
      name = name.replace(/[\[\]]/g, "\\$&");
      var regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)"),
        results = regex.exec(window.location.href);
      if (!results) return null;
      if (!results[2]) return '';
      return decodeURIComponent(results[2].replace(/\+/g, " "));
    }
    var ConfiguracionCanales = {
      "TELEFE": {
        url: "https://cdn.cvattv.com.ar/out/v1/Telefe_Tend/SA_Live_dash_cenc/TELEFE.mpd",
        k1: "41b893e8a7af43e9943e7d54a02c4e60",
        k2: "0b967f0ba9b543b8dac8ab9814b7970e"
      },
      "C5N": {
        url: "https://cdn.cvattv.com.ar/out/v1/C5N_Tend/SA_Live_dash_cenc/C5N.mpd",
        k1: "8fefbdadc7844e46952fb0320c77692d",
        k2: "8171ec5c2b04833cfc81cf2a7100753d"
      },
      "TN": {
        url: "https://cdn.cvattv.com.ar/out/v1/TN_Tend/SA_Live_dash_cenc/TN.mpd",
        k1: "2f0c81461adf4520971cf45ee5036d91",
        k2: "3e6b5789d099cdb3e192486bea627a05"
      },
    };

    var id = getParameterByName('id');
    // var config = ConfiguracionCanales[id];
    var config = ConfiguracionCanales[id];
    // var config = canales[id];

    if (config) {
      var sources = [];

      if (config.url.includes('.m3u8')) {
        sources.push({
          file: config.url
        });
      }

      if (config.url.includes('.mpd') && config.k1 && config.k2) {
        sources.push({
          file: config.url,
          drm: { "clearkey": { "keyId": config.k1, "key": config.k2 } }
        });
      }

      // JWWWWWW
      jwplayer("player").setup({
        playlist: [{
          title: "",
          description: "canalesonline.netlify.app",
          sources: sources
        }],
        width: "100%",
        height: "100%",
        autostart: true,
        mute: false,
        cast: {},
        sharing: {},
        // androidhls: true,
        displaytitle: true,
        stretching: "uniform",
        preload: "auto",
        liveSyncDuration: 3,
      });
    } else {
      document.getElementById("player").innerHTML = '<h2 class="error-message">Canal inválido o no encontrado.</h2>';
    }
  </script>
</body>

</html>
