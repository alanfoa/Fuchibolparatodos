            if (!results) return null;
            if (!results[2]) return '';
            return decodeURIComponent(results[2].replace(/\+/g, " "));

            const alertaDiv = document.getElementById("alerta-extension");

            if (useExtension) {

                    const img = document.createElement('img');
                    img.onload = installedCallback;
                    img.onerror = notInstalledCallback;
                    img.src = 'chrome-extension://opmeopcambhfimffbomjgemehjkbbmji/play-on.png';
                }

                var extensionUrl = `chrome-extension://opmeopcambhfimffbomjgemehjkbbmji/pages/player.html#${config}`;

                isExtensionInstalled(
                    () => {
                        playerDiv.classList.remove("hidden");
                        playerDiv.innerHTML = `<iframe id="iframe" allow="encrypted-media" allowfullscreen src="${extensionUrl}"></iframe>`;

                                <p>Luego instala la extensión <a target="_blank" href="https://chromewebstore.google.com/detail/reproductor-mpdm3u8m3uepg/opmeopcambhfimffbomjgemehjkbbmji">Reproductor M3U8 - HLS + DASH Player</a> en dicho navegador.</p>
