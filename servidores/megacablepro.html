<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta content="noindex, nofollow, noarchive" name="robots" />
    <meta name="referrer" content="no-referrer" />
    <title>Reproductor IPTV</title>
    <style>
        :root {
            --primary-color: #00d2ff;
            --bg-glass: rgba(15, 15, 20, 0.85);
            --border-glass: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        #flow-player {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #fp_video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Contenedor Flotante de Controles */
        .controls {
            position: absolute;
            left: 14px;
            right: 14px;
            bottom: 14px;
            z-index: 30;
            display: flex;
            flex-direction: column;
            /* En movil va en 2 filas */
            gap: 8px;
            padding: 12px;
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 18px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        /* Fila 1: Barra de progreso */
        .controls-top {
            width: 100%;
            display: flex;
            align-items: center;
        }

        /* Fila 2: Botones */
        .controls-bottom {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .controls-left,
        .controls-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-ctrl {
            background: transparent;
            border: none;
            cursor: pointer;
            width: 40px;
            height: 40px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            color: #fff;
            transition: background 0.2s ease, transform 0.15s ease;
            flex-shrink: 0;
        }

        .btn-ctrl:active {
            transform: scale(0.92);
        }

        .btn-ctrl svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Contenedor de Volumen */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        #fp_vol_bar {
            width: 50px;
            height: 4px;
            border-radius: 2px;
            appearance: none;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            cursor: pointer;
            display: none;
            /* Se oculta en celular por defecto */
        }

        #fp_vol_bar::-webkit-slider-thumb {
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
        }

        /* Barra de Progreso */
        #fp_bar {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            appearance: none;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            cursor: pointer;
        }

        #fp_bar::-webkit-slider-thumb {
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--primary-color);
            box-shadow: 0 0 10px var(--primary-color);
        }

        #fp_bar::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--primary-color);
            border: none;
        }

        /* Menú de Calidad */
        #fp_qmenu {
            position: absolute;
            right: 14px;
            bottom: 90px;
            z-index: 40;
            min-width: 120px;
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            padding: 6px;
            display: none;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        #fp_qmenu div {
            padding: 10px 14px;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
        }

        #fp_qmenu div:active {
            background: var(--primary-color);
            color: #000;
        }

        /* Auto-ocultar Interfaz */
        #flow-player.hide-ui {
            cursor: none;
        }

        #flow-player.hide-ui .controls {
            opacity: 0;
            transform: translateY(15px);
            pointer-events: none;
        }

        /* iPhone Landscape Hack */
        #flow-player.ios-landscape {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vh;
            height: 100vw;
            transform: rotate(90deg) translateY(-100%);
            transform-origin: top left;
            z-index: 9999;
        }

        /* Adaptación para Pantallas Grandes (PC / Tablets en Landscape) */
        @media (min-width: 768px) {
            .controls {
                flex-direction: row;
                /* Vuelve a 1 sola fila en PC */
                align-items: center;
                gap: 12px;
                padding: 10px 18px;
            }

            .controls-top {
                flex: 1;
            }

            .controls-bottom {
                width: auto;
                justify-content: flex-start;
                gap: 12px;
            }

            #fp_vol_bar {
                display: block;
                /* Muestra slider de volumen en PC */
            }

            .btn-ctrl:hover {
                background: rgba(255, 255, 255, 0.15);
                transform: scale(1.08);
            }
        }
    </style>
</head>

                    "7420dce6d24544caa3a15376126c6945": "68f402cc761bbef08b56cd9c201980bf",
                    "f3fb8bed8d2b44fab903a44d03f440b1": "68f402cc761bbef08b56cd9c201980bf"
                }
            },
        };
        var id = getParameterByName('id');
        var config = ConfiguracionCanales[id];

        const video = document.getElementById("fp_video");
        const bar = document.getElementById("fp_bar");
        const play = document.getElementById("fp_play");
        const icoPlay = document.getElementById("fp_icoPlay");
        const icoPause = document.getElementById("fp_icoPause");
        const mute = document.getElementById("fp_mute");
        const volBar = document.getElementById("fp_vol_bar");
        const icoVolMax = document.getElementById("fp_icoVolMax");
        const icoVolMute = document.getElementById("fp_icoVolMute");
        const fs = document.getElementById("fp_fs");
        const gear = document.getElementById("fp_gear");
        const qmenu = document.getElementById("fp_qmenu");
        const box = document.getElementById("flow-player");

        let lastVolume = 1;

        async function initShaka() {
            shaka.polyfill.installAll();

            if (!shaka.Player.isBrowserSupported()) {
                console.error("Shaka Player no soportado");
                return;
            }

            if (!config) {
                console.error("No se encontró configuración para el canal solicitado (id=" + id + ").");
                return;
            }

            const player = new shaka.Player(video);

            const drmConfig = {};
            if (config.clearkey) {
                drmConfig.clearKeys = config.clearkey;
            }

            player.configure({
                drm: drmConfig,
                abr: { enabled: true },
                preferredAudioLanguage: "es",
                preferredTextLanguage: "es",
                streaming: {
                    liveSync: {
                        enabled: true,
                        targetLatency: 3,
                        targetLatencyTolerance: 0.5
                    },
                    bufferingGoal: 10
                }
            });

            player.addEventListener("error", e => console.error("Shaka error:", e.detail));

            try {
                await player.load(config.url);
            } catch (e) {
                console.error("Error cargando el manifiesto:", e);
                return;
            }

            // Menú de calidad
            const tracks = player.getVariantTracks();
            const porAltura = new Map();
            tracks.filter(t => t.height).forEach(t => {
                const actual = porAltura.get(t.height);
                if (!actual || (t.bandwidth || 0) > (actual.bandwidth || 0)) {
                    porAltura.set(t.height, t);
                }
            });

            qmenu.innerHTML = "";
            const auto = document.createElement("div");
            auto.textContent = "Auto";
            auto.onclick = () => { player.configure({ abr: { enabled: true } }); qmenu.style.display = "none"; };
            qmenu.appendChild(auto);

            Array.from(porAltura.values())
                .sort((a, b) => b.height - a.height)
                .forEach(t => {
                    const d = document.createElement("div");
                    d.textContent = t.height + "p";
                    d.onclick = () => {
                        player.configure({ abr: { enabled: false } });
                        player.selectVariantTrack(t, true);
                        qmenu.style.display = "none";
                    };
                    qmenu.appendChild(d);
                });
        }

        initShaka();

        /* Reproducir / Pausa */
        play.onclick = () => video.paused ? video.play() : video.pause();
        video.onplay = () => { icoPlay.style.display = "none"; icoPause.style.display = "block"; showUI(); };
        video.onpause = () => { icoPlay.style.display = "block"; icoPause.style.display = "none"; box.classList.remove("hide-ui"); };

        /* Tiempo / Progreso */
        video.ontimeupdate = () => {
            bar.max = video.duration || 100;
            bar.value = video.currentTime;
        };
        bar.oninput = () => video.currentTime = bar.value;

        /* Control de Volumen y Mute */
        function updateVolumeUI() {
            if (video.muted || video.volume === 0) {
                icoVolMax.style.display = "none";
                icoVolMute.style.display = "block";
                volBar.value = 0;
            } else {
                icoVolMax.style.display = "block";
                icoVolMute.style.display = "none";
                volBar.value = video.volume;
            }
        }

        volBar.oninput = (e) => {
            const val = parseFloat(e.target.value);
            video.volume = val;
            video.muted = val === 0;
            if (val > 0) lastVolume = val;
            updateVolumeUI();
        };

        mute.onclick = () => {
            if (video.muted || video.volume === 0) {
                video.muted = false;
                video.volume = lastVolume > 0 ? lastVolume : 1;
            } else {
                lastVolume = video.volume;
                video.muted = true;
            }
            updateVolumeUI();
        };

        /* Pantalla Completa */
        function toggleFS() {
            if (!document.fullscreenElement) box.requestFullscreen();
            else document.exitFullscreen();
        }
        fs.onclick = toggleFS;
        video.ondblclick = toggleFS;

        let lastTap = 0;
        video.ontouchend = () => {
            const now = Date.now();
            if (now - lastTap < 300) toggleFS();
            lastTap = now;
        };

        /* Menú de Calidad */
        gear.onclick = (e) => {
            e.stopPropagation();
            qmenu.style.display = qmenu.style.display === "block" ? "none" : "block";
        };

        document.addEventListener("click", (e) => {
            if (!qmenu.contains(e.target) && e.target !== gear) {
                qmenu.style.display = "none";
            }
        });

        /* Orientación en iOS */
        const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
        document.addEventListener("fullscreenchange", async () => {
            if (document.fullscreenElement) {
                if (!isIOS && screen.orientation?.lock) { try { await screen.orientation.lock("landscape") } catch (e) { } }
                if (isIOS) box.classList.add("ios-landscape");
            } else {
                if (!isIOS && screen.orientation?.unlock) { try { screen.orientation.unlock() } catch (e) { } }
                box.classList.remove("ios-landscape");
            }
        });

        /* Ocultar interfaz automáticamente */
        let uiTimer;
        function showUI() {
            box.classList.remove("hide-ui");
            clearTimeout(uiTimer);
            if (!video.paused) {
                uiTimer = setTimeout(() => {
                    box.classList.add("hide-ui");
                    qmenu.style.display = "none";
                }, 3000);
            }
        }
        box.addEventListener("mousemove", showUI);
        box.addEventListener("touchstart", showUI);
        box.addEventListener("click", showUI);
    </script>
