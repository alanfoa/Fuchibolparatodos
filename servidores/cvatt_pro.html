<script type="text/javascript">

        function getParameterByName(name) {
                name = name.replace(/[\[]/, "\[").replace(/[\]]/, "\]");
                var regex = new RegExp("[\?&]" + name + "=([^&#]*)"),
                        results = regex.exec(location.search);
                return results === null ? "" : decodeURIComponent(results[1].replace(/\+/g, " "));
        }

        var getURL = getParameterByName('get');
        var getIMG = getParameterByName('img');
        var getKEY = getParameterByName('key');
        var getKEY2 = getParameterByName('key2');
        if (getURL == "") { alert('Vuelve a la pagina anterior'); }
</script>

        async function testSubdomains() {
                for (let i = 0; i < mt.length; i++) {
                        let subdomain = mt[i];
                        let mpdURL = "//" + subdomain + ".cvattv.com.ar/live/c" + number + "eds/" + atob(getURL) + "/SA_Live_dash_enc/" + atob(getURL) + ".mpd";

                        // console.log("MPDURL: "+mpdURL);
                        try {
                                await testMpdURL(mpdURL);
                                console.log("Subdomain", subdomain, "is working.");
                        } catch (error) {
                                console.error("Subdomain", subdomain, "is not working. Error:", error.message);
                        }
                }
        }

        function testMpdURL(url) {
                return new Promise((resolve, reject) => {
                        let xhr = new XMLHttpRequest();
                        xhr.onreadystatechange = function () {
                                if (xhr.readyState === 4) {
                                        if (xhr.status >= 200 && xhr.status < 300) {
                                                resolve();
                                        } else {
                                                reject(new Error("HTTP request failed with status " + xhr.status));
                                        }
                                }
                        };
                        xhr.open("GET", url, true);
                        xhr.send();
                });
        }
        testSubdomains();

        let channels = getChannelKeys(getURL)[0];

        keyId = channels.keyId;
        key = channels.key;

        var playerInstance = jwplayer("player");

        var random;

                });

        var getLang = getParameterByName('lang');
        if (getLang === null || getLang === "") {
                var lang = 1;
        } else {
                var lang = parseInt(getLang);
        }

        jwplayer().on('play', function (e) {
                jwplayer().setCurrentAudioTrack(lang);
        });


        function tryInitialize() {
                initializePlayer(false);
                playerInstance.on('error', function (e) {
                        if (e.code === 241401 || e.code === 241403) {
                                setTimeout(tryInitialize, 1000);
                        }
                });
        }

        function checkAndInitialize() {
                random = Math.floor(Math.random() * mt.length);
                var mtUrl = "//" + mt[random] + ".cvattv.com.ar";
                checkMtStatus(mtUrl, function (status) {
                        if (status === 200) {
                                initializePlayer(true);
                        } else {
                                setTimeout(checkAndInitialize, 1000);
                        }
                });
        }

        function checkMtStatus(mtUrl, callback) {
                var xhr = new XMLHttpRequest();
                xhr.onreadystatechange = function () {
                        if (xhr.readyState === 4) {
                                callback(xhr.status);
                        }
                };
                xhr.open('HEAD', mtUrl, true);
                xhr.send();
        }

        tryInitialize();

        if (typeof getURL !== 'undefined' && getURL !== null) {
                var errorCount = sessionStorage.getItem('errorCount');
                if (!errorCount) {
                        errorCount = 0;
                } else {
                        errorCount = parseInt(errorCount);
                }

                playerInstance.on("error", function () {
                        errorCount++;
                        // alert("Falla: "+mt[random])

        var selectedLanguage = getLang || 1;
        var languageChangedDuringPlay = false;

        jwplayer().on('play', function (e) {
                if (!languageChangedDuringPlay) {
                        var currentLanguage = jwplayer().getCurrentAudioTrack();
                        if (currentLanguage !== selectedLanguage) {
                                jwplayer().setCurrentAudioTrack(selectedLanguage);
                                languageChangedDuringPlay = true;
                        }
                }
        });

        jwplayer().on('complete', function (e) {
                languageChangedDuringPlay = false;
        });

        function getParameterByName(name) {
                var match = RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
                return match && decodeURIComponent(match[1].replace(/\+/g, ' '));
        }
