        // ============================================================

        var AES_CLAVES = ["Antena", "antenna", "Canal", "canal", "Stream", "stream", "Player", "player", "Video", "video", "Media", "media"];

        function b64urlToBytes(b64url) {
            var b64 = b64url.replace(/-/g, '+').replace(/_/g, '/');
            while (b64.length % 4) b64 += '=';
            var binary = atob(b64);
            var buf = new Uint8Array(binary.length);
            for (var i = 0; i < binary.length; i++) buf[i] = binary.charCodeAt(i);
            return buf;
        }

        async function aesDecrypt(ivB64, ctB64) {
            var iv = b64urlToBytes(ivB64);
            var ct = b64urlToBytes(ctB64);
            for (var i = 0; i < AES_CLAVES.length; i++) {
                try {
                    var kb = new Uint8Array(32);
                    var encoded = new TextEncoder().encode(AES_CLAVES[i]);
                    kb.set(encoded.slice(0, 32));
                    var key = await crypto.subtle.importKey('raw', kb, 'AES-GCM', false, ['decrypt']);
                    var decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
                    var texto = new TextDecoder().decode(decrypted);
                    console.log('AES-GCM OK con clave:', AES_CLAVES[i]);
                    return texto;
                } catch (e) { /* siguiente clave */ }
            }
            return null;
        }

        async function expandirAESGCM(html) {
            var reIVCT = /data-iv=["']([^"']+)["'][^>]*data-ct=["']([^"']+)["']/gi;
            var reCTIV = /data-ct=["']([^"']+)["'][^>]*data-iv=["']([^"']+)["']/gi;
            var bloques = [];
            var seen = new Set();
            var m;

            reIVCT.lastIndex = 0;
            while ((m = reIVCT.exec(html)) !== null) {
                var k = m[1] + '|' + m[2];
                if (!seen.has(k)) { seen.add(k); bloques.push({ iv: m[1], ct: m[2] }); }
            }
            reCTIV.lastIndex = 0;
            while ((m = reCTIV.exec(html)) !== null) {
                var k2 = m[2] + '|' + m[1];
                if (!seen.has(k2)) { seen.add(k2); bloques.push({ iv: m[2], ct: m[1] }); }
            }

            if (bloques.length === 0) { return html; }

            var extras = html;
            for (var i = 0; i < bloques.length; i++) {
                log('Desencriptando bloque ' + (i + 1) + '/' + bloques.length + '...');
                var texto = await aesDecrypt(bloques[i].iv, bloques[i].ct);
                if (texto) { extras += '\n' + texto; }
                else { console.warn('Bloque ' + (i + 1) + ': ninguna clave funcionó'); }
            }
            return extras;
        }

        function desencriptarUnescape(html) {
            var current = html;
            for (var i = 0; i < 20; i++) {
                var prev = current;
                try { var d = decodeURIComponent(current); if (d !== current) { current = d; continue; } } catch (e) { }
                var pat = /document\.write\s*\(\s*unescape\s*\(\s*["']([^"']+)["']\s*\)\s*\)/gi;
                var m, temp = current, found = 0;
                pat.lastIndex = 0;
                while ((m = pat.exec(current)) !== null) {
                    try { temp = temp.replace(m[0], unescape(m[1])); found++; } catch (e) { }
                }
                if (found > 0) { current = temp; continue; }
                if (current === prev) break;
            }
            return current;
        }

            var patrones = [

                /(https?:\/\/[^\s"'<>]+drmToken=[^\s"'<>&]{10,})/gi,
            ];
            for (var i = 0; i < patrones.length; i++) {
                patrones[i].lastIndex = 0;
                var m = patrones[i].exec(html);
                if (m && m[1] && m[1].startsWith('http')) return m[1].trim();

            for (var i = 0; i < patrones.length; i++) {
                patrones[i].lastIndex = 0;

                while ((m = patrones[i].exec(html)) !== null) {
                    var url = (m[1] || '').trim();

                if (linkIntermedio) {
                    var href = linkIntermedio.getAttribute('href');
                    console.log('Enlace intermedio:', href);
                    if (href && !href.includes('backup')) {
                        log('Cargando player externo...');
                        try {
                            var subHtml = await fetchConFallback(href);
                            subHtml = await expandirAESGCM(subHtml);
                            subHtml = desencriptarUnescape(subHtml);
                            var htmlTotal = html + '\n' + subHtml;
                            if (!drm) drm = extraerDRM(htmlTotal);
                            if (!mpdReferencia) mpdReferencia = extraerMPD(htmlTotal);
                        } catch (e) { console.warn('Enlace intermedio falló:', e.message); }
                    }
                }
            }

            return { drm: drm, mpdReferencia: mpdReferencia };
        }

        // ============================================================
        // PLAYER
        // ============================================================
        function iniciarPlayer(mpdUrl, drmUrl) {
            document.getElementById('loading-msg').style.display = 'none';
            jwplayer("player").setup({
                playlist: [{ title: "", sources: [{ file: mpdUrl, drm: { widevine: { url: drmUrl } } }] }],
                width: "100%", height: "100%",
                autostart: true, mute: false,
                cast: {}, sharing: {},
                displaytitle: false, stretching: "uniform",
                preload: "auto", liveSyncDuration: 3,
            });
            jwplayer().on('play', function () {
                var tracks = jwplayer().getAudioTracks();
                var idx = tracks.findIndex(function (t) {
                    var n = (t.name || '').toLowerCase();
                    return n.includes('spanish') || n.includes('spa') || n.includes('es');
                });
                jwplayer().setCurrentAudioTrack(idx !== -1 ? idx : 0);
            });
        }

        // ============================================================
        // INICIO
        // ============================================================
        var id = getParameterByName('id');
        var sufijo = NombreEnCDN[id];

        if (!sufijo) {
            mostrarError('Canal inválido o no encontrado.');
        } else {
            obtenerDRMYMPD()
                .then(function (resultado) {
                    var drm = resultado.drm;
                    var mpdReferencia = resultado.mpdReferencia;

                    if (!drm) {
                        mostrarError('No se pudo obtener la licencia DRM.');
                        return;
                    }

                    var mpdFinal;

                    if (mpdReferencia) {
                        // ✅ Caso normal: base extraída del blog + sufijo del canal
                        mpdFinal = construirMPDCanal(mpdReferencia, sufijo);
                    } else {
                        // ⚠️ Fallback: dominio hardcodeado (puede quedar desactualizado)
                        console.warn('⚠️ MPD de referencia no disponible, usando dominio fallback.');
                        mpdFinal = "https://trs.cdn.rcs.net.ar/" + sufijo;
                    }

                    console.log('▶️ MPD final:', mpdFinal);
                    console.log('🔑 DRM URL:', drm);
                    iniciarPlayer(mpdFinal, drm);
                })
                .catch(function (err) {
                    console.error('Error:', err);
                    mostrarError('Error: ' + err.message);
                });
        }
    </script>
    <script src="../js/script-config.js"></script>
