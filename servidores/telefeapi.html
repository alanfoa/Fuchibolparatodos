<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telefe api</title>
  <!-- Favicon -->
  <link rel="shortcut icon" href="../assets/favicon.png" type="image/png">
  <script src="//ssl.p.jwpcdn.com/player/v/8.26.0/jwplayer.js"></script>
  <script>jwplayer.key = "XSuP4qMl+9tK17QNb+4+th2Pm9AWgMO/cYH8CI0HGGr7bdjo";</script>

  <style>
    html,
    body {
      width: 100% !important;
      height: 100% !important;
      margin: 0;
      padding: 0;
    }

    :root {
      --colorbarra: #51E0C0;
      --coloriconos: #f0f0f0;
    }

    .jw-button-container .jw-icon {
      color: var(--coloriconos) !important;
    }

    .jw-slider-container .jw-progress {
      background-color: var(--colorbarra) !important;
    }

    .jw-icon:hover {
      color: var(--colorbarra) !important;
    }

    .jw-featured,
    .jw-rightclick {
      display: none !important;
    }
  </style>
  <link rel="stylesheet" href="style-jw.css">
</head>

<body
  style="margin:0; padding:0; background:#000; display:flex; justify-content:center; align-items:center; height:100vh;">
  <div id="player" style="width: 100%; height: 100%;"></div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- <script src="https://canalesonline.netlify.app/js/script-config.js"></script> -->
  <script src="../js/script-config.js"></script>
  <script>
    fetch("https://offsidetv-sabemosquiensos.netlify.app/.netlify/functions/get-telefe")
      .then(response => response.json())
      .then(data => {
        jwplayer("player").setup({
          file: data.url,
          width: "100%",
          height: "100%",
          autostart: true,
          mute: false,
          cast: {},
          sharing: {},
          // androidhls: true,
          displaytitle: true,
          stretching: "uniform",
          preload: "auto",
          liveSyncDuration: 3,
        });

        if (!/SmartTV|Tizen|Web0S|SmartHub|Chromecast/i.test(navigator.userAgent)) {
          // Esperar a que el reproductor esté listo
          jwplayer("player").on("ready", function () {
            var videoElement = document.querySelector("#player video");
            if (videoElement) {
              var audioContext = new (window.AudioContext || window.webkitAudioContext)();
              var source = audioContext.createMediaElementSource(videoElement);
              var gainNode = audioContext.createGain();

              gainNode.gain.value = 2;
              source.connect(gainNode);
              gainNode.connect(audioContext.destination);
            }
          });
        }
      })
      .catch(error => {
        document.body.innerHTML = "<h2 style='color: white; text-align: center;'>Error al cargar la señal.</h2>";
        console.error("Error:", error);
      });
  </script>
</body>

</html>
