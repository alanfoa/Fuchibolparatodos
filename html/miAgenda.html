<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="noindex, nofollow, noarchive" name="robots" />
    <meta name="referrer" content="no-referrer" />
    <title>Agenda Deportiva</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #0f1419 0%, #1a1f2e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #e4e4e7;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, #18181b 0%, #27272a 100%);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            border: 1px solid #3f3f46;
        }

        h1 {
            color: #fafafa;
            font-size: 1.75em;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        h1 a {
            /* font-size: 0.6em; */
            margin-left: 10px;
            text-decoration: none;
            color: #e4e4e7;
        }

        .filters-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .filters-main {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .filters-main .filter-group {
            flex: 1;
            min-width: 250px;
        }

        .filters-advanced {
            display: none;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 12px;
            margin-top: 8px;
            animation: slideDown 0.3s ease;
        }

        .filters-advanced.show {
            display: grid;
        }

        .toggle-filters-btn {
            background: #27272a;
            color: #a1a1aa;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.875em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: 1px solid #3f3f46;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            align-self: flex-end;
        }

        .toggle-filters-btn:hover {
            background: #2d2d30;
            border-color: #52525b;
            color: #fafafa;
        }

        .toggle-filters-btn .arrow {
            transition: transform 0.3s ease;
        }

        .toggle-filters-btn.active .arrow {
            transform: rotate(180deg);
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            color: #a1a1aa;
            margin-bottom: 8px;
            font-size: 0.875em;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input,
        select {
            padding: 14px 16px;
            background: #27272a;
            border: 1px solid #3f3f46;
            border-radius: 10px;
            font-size: 1em;
            color: #fafafa;
            transition: all 0.2s ease;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #71717a;
            background: #2d2d30;
            box-shadow: 0 0 0 3px rgba(113, 113, 122, 0.1);
        }

        input::placeholder {
            color: #52525b;
        }

        .loading {
            text-align: center;
            color: #a1a1aa;
            font-size: 1.5em;
            padding: 60px;
        }

        .date-section {
            margin-bottom: 40px;
        }

        .date-header {
            background: linear-gradient(135deg, #18181b 0%, #27272a 100%);
            padding: 20px 24px;
            border-radius: 12px;
            margin-bottom: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            border: 1px solid #3f3f46;
        }

        .date-header h2 {
            color: #fafafa;
            font-size: 1.5em;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .date-subheader {
            color: #ef4444;
            font-size: 0.875em;
            margin-top: 6px;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .events-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .event-item {
            background: linear-gradient(135deg, #1e1e22 0%, #26262b 100%);
            border: 1px solid #3f3f46;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .event-item:hover {
            background: linear-gradient(135deg, #232328 0%, #2a2a30 100%);
            border-color: #52525b;
        }

        .event-item.expanded {
            border-color: #10b981;
        }

        .event-main {
            display: grid;
            grid-template-columns: 80px 50px 1fr auto;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
        }

        .event-time {
            color: #fafafa;
            font-weight: 700;
            font-size: 1.1em;
            text-align: center;
        }

        .sport-icon {
            font-size: 2em;
            text-align: center;
        }

        .event-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .event-tournament {
            color: #a1a1aa;
            font-size: 0.75em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .event-name {
            color: #fafafa;
            font-weight: 600;
            font-size: 1em;
        }

        .event-countdown {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .countdown-badge {
            background: linear-gradient(135deg, #27272a 0%, #3f3f46 100%);
            color: #fafafa;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.75em;
            border: 1px solid #52525b;
            white-space: nowrap;
        }

        .countdown-badge.live {
            background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%);
            border-color: #ef4444;
            animation: pulse 2s infinite;
        }

        .expand-icon {
            color: #a1a1aa;
            font-size: 1.2em;
            transition: transform 0.3s ease;
        }

        .event-item.expanded .expand-icon {
            transform: rotate(180deg);
        }

        .event-channels {
            display: none;
            padding: 0 20px 20px 20px;
            border-top: 1px solid #3f3f46;
        }

        .event-item.expanded .event-channels {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }

        .channel-badge {
            background: #27272a;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.875em;
            color: #a1a1aa;
            font-weight: 600;
            border: 1px solid #3f3f46;
            text-align: center;
        }

        .channel-link {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.875em;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .channel-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.6);
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
        }

        .play-icon {
            width: 12px;
            height: 12px;
            border-left: 8px solid #ffffff;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            }

            50% {
                transform: scale(1.05);
                box-shadow: 0 0 0 8px rgba(239, 68, 68, 0);
            }
        }

        .no-results {
            text-align: center;
            color: #a1a1aa;
            font-size: 1.25em;
            padding: 60px;
            background: linear-gradient(135deg, #18181b 0%, #27272a 100%);
            border-radius: 12px;
            margin-top: 24px;
            border: 1px solid #3f3f46;
        }

        .live-filter-btn {
            background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%);
            color: #ffffff;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 0.875em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: 2px solid #ef4444;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            align-self: flex-end;
        }

        .live-filter-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.6);
            background: linear-gradient(135deg, #b91c1c 0%, #dc2626 100%);
        }

        .live-filter-btn.active {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            border-color: #10b981;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }

        @media (max-width: 768px) {
            .filters-main {
                flex-direction: column;
                align-items: stretch;
            }

            .filters-main .filter-group {
                min-width: 100%;
            }

            .toggle-filters-btn,
            .live-filter-btn {
                width: 100%;
                justify-content: center;
            }

            .event-main {
                grid-template-columns: 60px 40px 1fr auto;
                gap: 12px;
                padding: 12px 16px;
            }

            .event-time {
                font-size: 0.9em;
            }

            .sport-icon {
                font-size: 1.5em;
            }

            .event-name {
                font-size: 0.9em;
            }

            .channels-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>
                📅 Agenda Deportiva
                <a href='/html/miagenda' target='_blank' title='Abrir en nueva ventana'>
                    <i class="bi bi-box-arrow-up-right"></i>
                </a>
            </h1>

            <div class="filters-container">
                <div class="filters-main">
                    <div class="filter-group">
                        <label for="search">🔍 Buscar</label>
                        <input type="text" id="search" placeholder="Evento o equipo...">
                    </div>

                    <button id="liveFilterBtn" class="live-filter-btn">
                        <span>🔴</span>
                        <span>EN VIVO</span>
                    </button>

                    <button id="toggleFiltersBtn" class="toggle-filters-btn">
                        <span>⚙️ Filtros</span>
                        <span class="arrow">▼</span>
                    </button>
                </div>

                <div class="filters-advanced" id="advancedFilters">
                    <div class="filter-group">
                        <label for="deporte">⚽ Deporte</label>
                        <select id="deporte">
                            <option value="all">Todos los deportes</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="torneo">🏆 Torneo</label>
                        <select id="torneo">
                            <option value="all">Todos los torneos</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="canal">📺 Canal</label>
                        <select id="canal">
                            <option value="all">Todos los canales</option>
                        </select>
                    </div>
                </div>
            </div>
        </header>

        <div id="loading" class="loading">Cargando eventos deportivos...</div>
        <div id="content"></div>
    </div>

    <script>
        let agendaData = null;
        let countdownInterval = null;
        let liveFilterActive = false;

        let pagina = "";
        if (window.location.pathname.includes('/pro/')) pagina = "/pro/";
        else pagina = "/";

        const CANALES_DISPONIBLES = {
            "TELEFE": "https://canalesonline.netlify.app" + pagina + "?stream=TELEFE",
            "ESPN Premium": "https://canalesonline.netlify.app" + pagina + "?stream=ESPN+Premium",
            "ESPN": "https://canalesonline.netlify.app" + pagina + "?stream=ESPN",
            "ESPN 2": "https://canalesonline.netlify.app" + pagina + "?stream=ESPN+2",
            "ESPN 3": "https://canalesonline.netlify.app" + pagina + "?stream=ESPN+3",
            "ESPN 4": "https://canalesonline.netlify.app" + pagina + "?stream=ESPN+4",
            "ESPN 5": "https://canalesonline.netlify.app" + pagina + "?stream=ESPN+5",
            "ESPN 6": "https://canalesonline.netlify.app" + pagina + "?stream=ESPN+6",
            "ESPN 7": "https://canalesonline.netlify.app" + pagina + "?stream=ESPN+7",
            "FOX SPORTS": "https://canalesonline.netlify.app" + pagina + "?stream=FOX+SPORTS",
            "FOX SPORTS 2": "https://canalesonline.netlify.app" + pagina + "?stream=FOX+SPORTS+2",
            "FOX SPORTS 3": "https://canalesonline.netlify.app" + pagina + "?stream=FOX+SPORTS+3",
            "TYC SPORTS": "https://canalesonline.netlify.app" + pagina + "?stream=TyC+Sports",
            "TNT SPORTS": "https://canalesonline.netlify.app" + pagina + "?stream=TNT+Sports",
            "DSPORTS": "https://canalesonline.netlify.app" + pagina + "?stream=DSports",
            "DSPORTS 2": "https://canalesonline.netlify.app" + pagina + "?stream=DSports2",
            "DSPORTS +": "https://canalesonline.netlify.app" + pagina + "?stream=DSports Plus",
            "LPF PLAY": "https://canalesonline.netlify.app" + pagina + "?stream=LPF+PLAY",
        };

        // ─── NUEVO: Convierte el formato matchConfig.content al formato fechas/torneos/eventos ───
        function parseMatchConfigContent(nextData) {
            try {
                const content = nextData?.props?.pageProps?.matchConfig?.content;
                const hoy = nextData?.props?.pageProps?.site
                    ? (() => {
                        // Calcular hoy en timezone Argentina
                        const now = new Date();
                        const arTime = new Date(now.toLocaleString('en-US', { timeZone: 'America/Argentina/Buenos_Aires' }));
                        const y = arTime.getFullYear();
                        const m = String(arTime.getMonth() + 1).padStart(2, '0');
                        const d = String(arTime.getDate()).padStart(2, '0');
                        return `${y}-${m}-${d}`;
                    })()
                    : null;

                if (!content || !Array.isArray(content)) {
                    console.log('❌ No se encontró matchConfig.content');
                    return null;
                }

                console.log(`✅ matchConfig.content encontrado con ${content.length} eventos`);

                // Filtrar solo Argentina (excluir eventos de Ecuador y USA)
                const eventosFiltrados = content.filter(ev => {
                    const section = ev.sections?.[0]?.url || '';
                    // Incluir solo eventos-argentina
                    return section.includes('eventos-argentina');
                });

                console.log(`📊 Eventos Argentina: ${eventosFiltrados.length} de ${content.length}`);

                // Agrupar por fecha y torneo
                const fechasMap = {};

                eventosFiltrados.forEach(ev => {
                    if (ev.type !== 'event') return;

                    // Obtener fecha del evento
                    // startDate viene en UTC, convertir a Argentina (UTC-3)
                    const startUTC = new Date(ev.startDate);
                    const startAR = new Date(startUTC.toLocaleString('en-US', { timeZone: 'America/Argentina/Buenos_Aires' }));
                    const fechaKey = `${startAR.getFullYear()}-${String(startAR.getMonth() + 1).padStart(2, '0')}-${String(startAR.getDate()).padStart(2, '0')}`;
                    const horaStr = `${String(startAR.getHours()).padStart(2, '0')}:${String(startAR.getMinutes()).padStart(2, '0')}:00`;
                    const fechaCompleta = `${fechaKey} ${horaStr}`;

                    // Nombre del torneo
                    const torneoNombre = ev.tagsEvent?.name || 'Sin torneo';

                    // Deporte desde la sección
                    // Ej: "Eventos Argentina - Fútbol" → "Fútbol"
                    const seccionNombre = ev.sections?.[0]?.name || '';
                    const deporteNombre = seccionNombre.includes(' - ')
                        ? seccionNombre.split(' - ')[1].trim()
                        : 'Polideportivo';

                    // Canales
                    const canales = (ev.tagsChannel || []).map(ch => ({ nombre: ch.name }));

                    // Construir evento en formato compatible
                    const evento = {
                        nombre: ev.title || ev.eventTitle || 'Sin nombre',
                        fecha: fechaCompleta,
                        deporte: { nombre: deporteNombre },
                        canales: canales
                    };

                    // Agregar a la estructura fechas
                    if (!fechasMap[fechaKey]) {
                        fechasMap[fechaKey] = {};
                    }
                    if (!fechasMap[fechaKey][torneoNombre]) {
                        fechasMap[fechaKey][torneoNombre] = [];
                    }
                    fechasMap[fechaKey][torneoNombre].push(evento);
                });

                // Convertir el mapa a array ordenado
                const fechasArray = Object.keys(fechasMap)
                    .sort()
                    .map(fechaKey => ({
                        fecha: fechaKey,
                        torneos: Object.keys(fechasMap[fechaKey]).map(torneoNombre => ({
                            nombre: torneoNombre,
                            eventos: fechasMap[fechaKey][torneoNombre]
                        }))
                    }));

                // Extraer lista de canales únicos para el filtro
                const canalesSet = new Set();
                eventosFiltrados.forEach(ev => {
                    (ev.tagsChannel || []).forEach(ch => canalesSet.add(ch.name));
                });
                const canalesList = Array.from(canalesSet).map(n => ({ nombre: n }));

                const result = {
                    hoy: hoy,
                    fechas: fechasArray,
                    canales: canalesList
                };

                console.log(`📅 Fechas procesadas: ${fechasArray.length}`);
                console.log(`📺 Canales: ${canalesList.length}`);

                return result;

            } catch (err) {
                console.error('❌ Error en parseMatchConfigContent:', err);
                return null;
            }
        }

        async function loadData() {
            try {
                document.getElementById('loading').innerHTML = 'Cargando eventos desde Ole.com.ar...';

                const localBackup = loadFromLocalStorage();
                if (localBackup) {
                    console.log('📦 Usando datos guardados como respaldo temporal');
                }

                const pageURL = 'https://www.ole.com.ar/agenda-deportiva';
                const proxies = [
                    // "https://corsproxy.io/?",
                    "https://api.codetabs.com/v1/proxy/?quest=",
                    "https://api.allorigins.win/raw?url=",
                    "https://cors-proxy.wangzhishi.net/",
                    "https://pelisjuanita.com/tv/corsproxy.php?url=",
                    "https://myproxy.senorgatorade123.workers.dev/?url=",
                ];

                let success = false;

                for (const proxy of proxies) {
                    try {
                        const url = proxy + encodeURIComponent(pageURL);
                        console.log('🔄 Intentando con:', proxy);

                        const response = await fetch(url);
                        if (!response.ok) continue;

                        const html = await response.text();

                        // Extraer __NEXT_DATA__
                        const jsonMatch = html.match(/<script id="__NEXT_DATA__" type="application\/json">([\s\S]*?)<\/script>/);

                        if (!jsonMatch || !jsonMatch[1]) {
                            console.log('⚠️ No se encontró __NEXT_DATA__');
                            continue;
                        }

                        let nextData;
                        try {
                            nextData = JSON.parse(jsonMatch[1].trim());
                            console.log('✅ __NEXT_DATA__ parseado');
                        } catch (e) {
                            console.error('❌ Error al parsear JSON:', e);
                            continue;
                        }

                        // Intentar nuevo formato (matchConfig.content)
                        let serviceData = parseMatchConfigContent(nextData);

                        // Si falla, intentar formato antiguo (fechas/torneos/eventos)
                        if (!serviceData || !serviceData.fechas || serviceData.fechas.length === 0) {
                            console.log('⚠️ Nuevo formato vacío, intentando formato antiguo...');
                            serviceData = nextData?.props?.pageProps?.data?.service?.data
                                || nextData?.props?.pageProps?.data
                                || null;

                            if (serviceData && !serviceData.fechas) serviceData = null;
                        }

                        if (serviceData && serviceData.fechas && serviceData.fechas.length > 0) {
                            agendaData = mergeWithLocalData(serviceData);
                            saveToLocalStorage(agendaData);
                            document.getElementById('loading').style.display = 'none';
                            populateFilters();
                            renderEvents();
                            success = true;
                            console.log('✅ Datos cargados. Fechas:', agendaData.fechas.length);
                            break;
                        } else {
                            console.log('⚠️ No se encontraron eventos en ningún formato');
                        }

                    } catch (proxyError) {
                        console.error('❌ Error con proxy:', proxy, proxyError.message);
                        continue;
                    }
                }

                if (!success) throw new Error('No se pudo cargar desde ningún proxy');
                return success;

            } catch (error) {
                console.error('❌ Error general al cargar datos:', error);

                const localData = loadFromLocalStorage();
                if (localData) {
                    console.log('⚠️ Usando datos guardados localmente');
                    agendaData = localData;
                    document.getElementById('loading').style.display = 'none';
                    populateFilters();
                    renderEvents();
                    return true;
                }

                document.getElementById('loading').innerHTML = `
                    ❌ Error al cargar los eventos.<br>
                    <small style="color: #a1a1aa; margin-top: 10px; display: block;">
                        Intenta recargar la página o verifica tu conexión a internet.
                    </small>
                `;
                return false;
            }
        }

        function populateFilters() {
            const deportes = new Set();
            const canales = agendaData.canales || [];

            agendaData.fechas.forEach(fecha => {
                fecha.torneos.forEach(torneo => {
                    torneo.eventos.forEach(evento => {
                        if (evento.deporte && evento.deporte.nombre) {
                            deportes.add(evento.deporte.nombre);
                        }
                    });
                });
            });

            const deporteSelect = document.getElementById('deporte');
            deportes.forEach(deporte => {
                const option = document.createElement('option');
                option.value = deporte;
                option.textContent = deporte;
                deporteSelect.appendChild(option);
            });

            const torneos = new Set();
            agendaData.fechas.forEach(fecha => {
                fecha.torneos.forEach(torneo => {
                    if (torneo.nombre) torneos.add(torneo.nombre);
                });
            });

            const torneoSelect = document.getElementById('torneo');
            Array.from(torneos).sort().forEach(torneo => {
                const option = document.createElement('option');
                option.value = torneo;
                option.textContent = torneo;
                torneoSelect.appendChild(option);
            });

            const canalSelect = document.getElementById('canal');
            const canalesUnicos = new Set();

            canales.forEach(canal => {
                let nombreNormalizado = canal.nombre;
                if (nombreNormalizado.includes('DSports') || nombreNormalizado.includes('DSPORTS')) {
                    nombreNormalizado = 'DSports';
                }
                if (nombreNormalizado.includes('Disney')) {
                    nombreNormalizado = 'Disney + Premium';
                }
                canalesUnicos.add(nombreNormalizado);
            });

            Array.from(canalesUnicos).sort().forEach(canal => {
                const option = document.createElement('option');
                option.value = canal;
                option.textContent = canal;
                canalSelect.appendChild(option);
            });
        }

        function formatDate(dateString) {
            const [year, month, day] = dateString.split('-');
            const date = new Date(year, month - 1, day);
            const days = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
            const months = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
            return `${days[date.getDay()]}, ${date.getDate()} de ${months[date.getMonth()]} de ${date.getFullYear()}`;
        }

        function formatTime(dateString) {
            const parts = dateString.split(' ');
            if (parts.length < 2) return '';
            const timePart = parts[1];
            const [hours, minutes] = timePart.split(':');
            return `${hours}:${minutes}`;
        }

        function getTimeRemaining(eventDate) {
            const now = new Date();
            const parts = eventDate.split(' ');
            const [datePart, timePart] = parts;
            const [year, month, day] = datePart.split('-');
            const [hours, minutes, seconds] = timePart.split(':');

            const event = new Date(year, month - 1, day, hours, minutes, seconds || 0);
            const diff = event - now;

            if (diff < -7200000) return null;

            if (diff < 0 && diff >= -7200000) {
                return { text: '🔴 EN VIVO', class: 'live', isLive: true };
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hrs = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

            if (days > 0) return { text: `${days}d ${hrs}h`, class: '', isLive: false };
            if (hrs > 0) return { text: `${hrs}h ${mins}m`, class: '', isLive: false };
            if (mins > 0) return { text: `${mins}m`, class: '', isLive: false };
            return { text: '🔴 ¡POR COMENZAR!', class: 'live', isLive: true };
        }

        function getChannelLink(channelName) {
            if (CANALES_DISPONIBLES[channelName]) return CANALES_DISPONIBLES[channelName];
            for (const [key, value] of Object.entries(CANALES_DISPONIBLES)) {
                if (channelName.toUpperCase().includes(key.toUpperCase()) ||
                    key.toUpperCase().includes(channelName.toUpperCase())) {
                    return value;
                }
            }
            return null;
        }

        function toggleEvent(eventElement) {
            const wasExpanded = eventElement.classList.contains('expanded');
            document.querySelectorAll('.event-item.expanded').forEach(el => {
                if (el !== eventElement) el.classList.remove('expanded');
            });
            if (!wasExpanded) eventElement.classList.add('expanded');
            else eventElement.classList.remove('expanded');
        }

        function renderEvents() {
            const searchTerm = document.getElementById('search').value.toLowerCase();
            const selectedDeporte = document.getElementById('deporte').value;
            const selectedTorneo = document.getElementById('torneo').value;
            const selectedCanal = document.getElementById('canal').value;

            let filteredEvents = 0;
            const content = document.getElementById('content');
            content.innerHTML = '';

            agendaData.fechas.forEach(fecha => {
                const dateSection = document.createElement('div');
                dateSection.className = 'date-section';

                const dateHeader = document.createElement('div');
                dateHeader.className = 'date-header';
                dateHeader.innerHTML = `
                    <h2>${formatDate(fecha.fecha)}</h2>
                    <div class="date-subheader">${fecha.fecha === agendaData.hoy ? '🔴 HOY' : ''}</div>
                `;

                const eventsList = document.createElement('div');
                eventsList.className = 'events-list';

                let hasVisibleEvents = false;

                const allEvents = [];
                fecha.torneos.forEach(torneo => {
                    torneo.eventos.forEach(evento => {
                        allEvents.push({ evento, torneo });
                    });
                });

                allEvents.sort((a, b) => new Date(a.evento.fecha) - new Date(b.evento.fecha));

                allEvents.forEach(({ evento, torneo }) => {
                    const timeRemaining = getTimeRemaining(evento.fecha);
                    if (!timeRemaining) return;

                    const matchesSearch = evento.nombre.toLowerCase().includes(searchTerm) ||
                        torneo.nombre.toLowerCase().includes(searchTerm);
                    const matchesDeporte = selectedDeporte === 'all' || evento.deporte.nombre === selectedDeporte;
                    const matchesCanal = selectedCanal === 'all' ||
                        evento.canales.some(c => c.nombre === selectedCanal ||
                            c.nombre.includes(selectedCanal) || selectedCanal.includes(c.nombre));
                    const matchesTorneo = selectedTorneo === 'all' || torneo.nombre === selectedTorneo;
                    const matchesLive = !liveFilterActive || timeRemaining.isLive;

                    if (matchesSearch && matchesDeporte && matchesTorneo && matchesCanal && matchesLive) {
                        filteredEvents++;
                        hasVisibleEvents = true;

                        const eventItem = document.createElement('div');
                        eventItem.className = 'event-item';

                        let channelsHTML = '';
                        evento.canales.forEach(canal => {
                            const link = getChannelLink(canal.nombre);
                            if (link) {
                                channelsHTML += `<a href="${link}" target="_blank" class="channel-link">
                                    <span>📺 ${canal.nombre}</span>
                                    <div class="play-icon"></div>
                                </a>`;
                            } else {
                                channelsHTML += `<span class="channel-badge">📺 ${canal.nombre}</span>`;
                            }
                        });

                        if (!channelsHTML) {
                            channelsHTML = `<span class="channel-badge">📺 Canal no disponible</span>`;
                        }

                        eventItem.innerHTML = `
                            <div class="event-main">
                                <div class="event-time">${formatTime(evento.fecha)}</div>
                                <div class="sport-icon">${getDeporteIcon(evento.deporte.nombre)}</div>
                                <div class="event-info">
                                    <div class="event-tournament">${torneo.nombre}</div>
                                    <div class="event-name">${evento.nombre}</div>
                                </div>
                                <div class="event-countdown">
                                    <div class="countdown-badge ${timeRemaining.class}">${timeRemaining.text}</div>
                                    <div class="expand-icon">▼</div>
                                </div>
                            </div>
                            <div class="event-channels">
                                <div class="channels-grid">${channelsHTML}</div>
                            </div>
                        `;

                        eventItem.querySelector('.event-main').addEventListener('click', () => {
                            toggleEvent(eventItem);
                        });

                        eventsList.appendChild(eventItem);
                    }
                });

                if (hasVisibleEvents) {
                    dateSection.appendChild(dateHeader);
                    dateSection.appendChild(eventsList);
                    content.appendChild(dateSection);
                }
            });

            if (filteredEvents === 0) {
                const noResultsMessage = liveFilterActive ?
                    'No hay eventos en vivo en este momento 😔' :
                    'No se encontraron eventos con los filtros seleccionados 😔';
                content.innerHTML = `<div class="no-results">${noResultsMessage}</div>`;
            }
        }

        function getDeporteIcon(deporte) {
            const icons = {
                'Fútbol': '⚽',
                'Básquet': '🏀',
                'Tenis': '🎾',
                'Polideportivo': '🏅',
                'Rugby': '🏉',
                'NFL': '🏈',
                'Hockey sobre Hielo': '🏒',
                'Boxeo': '🥊'
            };
            return icons[deporte] || '🏆';
        }

        function saveToLocalStorage(data) {
            try {
                const dataToSave = { timestamp: new Date().toISOString(), data: data };
                localStorage.setItem('agendaDeportiva', JSON.stringify(dataToSave));
                console.log('✅ Datos guardados en localStorage');
            } catch (error) {
                console.error('❌ Error al guardar en localStorage:', error);
            }
        }

        function loadFromLocalStorage() {
            try {
                const saved = localStorage.getItem('agendaDeportiva');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    console.log('📦 Datos encontrados en localStorage del:', parsed.timestamp);
                    return parsed.data;
                }
            } catch (error) {
                console.error('❌ Error al cargar desde localStorage:', error);
            }
            return null;
        }

        function mergeWithLocalData(newData) {
            const localData = loadFromLocalStorage();
            if (!localData) return newData;

            const today = newData.hoy;
            const mergedData = JSON.parse(JSON.stringify(newData));

            const localTodayFecha = localData.fechas.find(f => f.fecha === today);
            const newTodayFecha = mergedData.fechas.find(f => f.fecha === today);

            if (localTodayFecha && newTodayFecha) {
                const existingEventIds = new Set();
                newTodayFecha.torneos.forEach(torneo => {
                    torneo.eventos.forEach(evento => {
                        existingEventIds.add(evento.fecha + evento.nombre);
                    });
                });

                localTodayFecha.torneos.forEach(localTorneo => {
                    localTorneo.eventos.forEach(localEvento => {
                        const eventId = localEvento.fecha + localEvento.nombre;
                        if (!existingEventIds.has(eventId)) {
                            let targetTorneo = newTodayFecha.torneos.find(t => t.nombre === localTorneo.nombre);
                            if (!targetTorneo) {
                                targetTorneo = { nombre: localTorneo.nombre, eventos: [] };
                                newTodayFecha.torneos.push(targetTorneo);
                            }
                            targetTorneo.eventos.push(localEvento);
                        }
                    });
                });
            }

            return mergedData;
        }

        document.getElementById('search').addEventListener('input', renderEvents);
        document.getElementById('deporte').addEventListener('change', renderEvents);
        document.getElementById('torneo').addEventListener('change', renderEvents);
        document.getElementById('canal').addEventListener('change', renderEvents);

        document.getElementById('toggleFiltersBtn').addEventListener('click', function () {
            const advancedFilters = document.getElementById('advancedFilters');
            advancedFilters.classList.toggle('show');
            this.classList.toggle('active');
        });

        document.getElementById('liveFilterBtn').addEventListener('click', function () {
            liveFilterActive = !liveFilterActive;
            this.classList.toggle('active');
            if (liveFilterActive) {
                this.innerHTML = '<span>✓</span><span>Mostrando solo EN VIVO</span>';
            } else {
                this.innerHTML = '<span>🔴</span><span>EN VIVO</span>';
            }
            renderEvents();
        });

        function startCountdownUpdates() {
            if (countdownInterval) clearInterval(countdownInterval);
            countdownInterval = setInterval(() => { renderEvents(); }, 60000);
        }

        function startAutoRefresh() {
            setInterval(() => {
                console.log('🔄 Actualizando datos...');
                loadData();
            }, 300000);
        }

        loadData().then(success => {
            if (success) {
                startCountdownUpdates();
                startAutoRefresh();
            }
        });


        document.addEventListener('contextmenu', function (e) {
            e.preventDefault();
        });
    </script>
    <script src="../js/script-config.js"></script>
</body>
