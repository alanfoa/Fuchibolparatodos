                window.open(link, '_blank');

        // === VARIABLES GLOBALES ===
        let allChannels = [];
        let timelineStartHour = 0;
        let pixelsPerMinute = 5;
        const hoursToShow = 48; // Mostrar 24 horas completas

        const channelsToHide = [
            'Canal Provincial',
            'TRT WORLD',
            "CNN internacional",
            "RTP",
            "AMÉRICA",
            "MAS CHIC",
            "Arirang",
            "Canal Vasco",
            "Club MTV!",
            "señal santa maría",
            "TeleRed",
        ];

        function shouldHideChannel(channelName) {
            const lowerName = channelName.toLowerCase().trim();
            return channelsToHide.some(hideName =>
                lowerName === hideName.toLowerCase().trim() ||
                lowerName.includes(hideName.toLowerCase().trim())
            );
        }

        function removeDuplicateChannels(channels) {
            const seen = new Map();

            channels.forEach(channel => {
                const baseName = channel.name
                    .replace(/\s*HD\s*/gi, '')
                    .replace(/\s+/g, ' ')
                    .trim()
                    .toLowerCase();

                const isHD = /HD/i.test(channel.name);

                if (!seen.has(baseName)) {
                    seen.set(baseName, channel);
                } else {
                    const existing = seen.get(baseName);
                    const existingIsHD = /HD/i.test(existing.name);

                    if (isHD && !existingIsHD) {
                        seen.set(baseName, channel);
                    }
                }
            });

            return Array.from(seen.values());
        }

        function updateCurrentTime() {
            const now = new Date();
            const options = {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                timeZone: 'America/Argentina/Buenos_Aires'
            };
            const timeString = now.toLocaleString('es-AR', options);
            document.getElementById('currentTimeDisplay').textContent = timeString;
        }

        function parseTime(timeStr) {
            const match = timeStr.match(/(\d+):(\d+)/);
            if (!match) return null;
            return { hours: parseInt(match[1]), minutes: parseInt(match[2]) };
        }

        function timeToMinutes(timeObj) {
            if (!timeObj) return 0;
            return timeObj.hours * 60 + timeObj.minutes;
        }

        function minutesToPixels(minutes, isNextDay = false) {
            const timelineStartMinutes = timelineStartHour * 60;

            // Si el programa es del día siguiente, sumar 24 horas
            let adjustedMinutes = minutes;
            if (isNextDay) {
                adjustedMinutes = minutes + (24 * 60);
            }

            return (adjustedMinutes - timelineStartMinutes) * pixelsPerMinute;
        }

        function getCurrentTimeInMinutes() {
            const now = new Date();
            const argTime = new Date(now.toLocaleString('en-US', { timeZone: 'America/Argentina/Buenos_Aires' }));
            return argTime.getHours() * 60 + argTime.getMinutes();
        }

        function isNowPlaying(startMinutes, endMinutes, isNextDay = false) {
            const currentMinutes = getCurrentTimeInMinutes();

            // **IMPORTANTE: Los programas del día siguiente NUNCA están en vivo**
            if (isNextDay) {
                return false;
            }

            if (endMinutes > startMinutes) {
                return currentMinutes >= startMinutes && currentMinutes < endMinutes;
            }

            return currentMinutes >= startMinutes || currentMinutes < endMinutes;
        }

        function calculateTimelineStart() {
            // Empezar desde la hora actual para no mostrar programas pasados
            const now = new Date();
            const argTime = new Date(now.toLocaleString('en-US', { timeZone: 'America/Argentina/Buenos_Aires' }));
            timelineStartHour = argTime.getHours();
        }

        function renderTimeline() {
            const content = document.getElementById('content');

            if (allChannels.length === 0) {
                content.innerHTML = '<div class="loading"><div class="spinner"></div><p>Cargando...</p></div>';
                return;
            }

            calculateTimelineStart();
            const timelineWidth = hoursToShow * 60 * pixelsPerMinute;

            let html = '<div class="timeline-container">';

            html += '<div class="timeline-header">';
            html += '<div class="time-labels" style="width: ' + timelineWidth + 'px">';

            for (let i = 0; i <= hoursToShow; i++) {
                const hour = (timelineStartHour + i) % 24;
                const position = i * 60 * pixelsPerMinute;
                const isMajor = i % 3 === 0;
                html += `<div class="time-label ${isMajor ? 'major' : ''}" style="left: ${position}px">${hour.toString().padStart(2, '0')}:00</div>`;
            }

            html += '</div></div>';

            html += '<div class="channels-container">';

            html += '<div class="grid-lines" style="width: ' + timelineWidth + 'px">';
            for (let i = 0; i <= hoursToShow; i++) {
                const position = i * 60 * pixelsPerMinute;
                const isMajor = i % 1 === 0;
                html += `<div class="grid-line ${isMajor ? 'major' : ''}" style="left: ${position}px"></div>`;
            }
            html += '</div>';

            allChannels.forEach(channel => {
                if (shouldHideChannel(channel.name)) {
                    return;
                }
                // console.log(`"${channel.name}":"https://canalesonline.netlify.app/?stream=",`)
                html += '<div class="channel-row">';

                const channelLink = getChannelLink(channel.name);
                const hasLinkClass = channelLink ? 'has-link' : '';
                const titleAttr = channelLink ? 'title="Click para ver en vivo"' : '';

                const logoHtml = channel.logo
                    ? `<img src="${channel.logo}" alt="${channel.name}" style="width: 30px; height: 30px; object-fit: contain; margin-right: 8px; border-radius: 4px;">`
                    : '';

                html += `<div class="channel-name ${hasLinkClass}" onclick="openChannel('${channel.name.replace(/'/g, "\\'")}');" ${titleAttr}>
                            <div style="display: flex; align-items: center;">
                                ${logoHtml}
                                <div>
                                    <div class="channel-name-text">${channel.name}</div>
                                </div>
                            </div>
                        </div>`;

                html += `<div class="programs-timeline" style="width: ${timelineWidth}px">`;

                channel.programs.forEach((program, index) => {
                    const startTime = parseTime(program.time);
                    if (!startTime) return;

                    let startMinutes = timeToMinutes(startTime);

                    // **IMPORTANTE: Calcular posición considerando si es del día siguiente**
                    let left = minutesToPixels(startMinutes, program.isNextDay);

                    let endMinutes;
                    if (program.endTime) {
                        const endTime = parseTime(program.endTime);
                        endMinutes = timeToMinutes(endTime);

                        // **CRÍTICO: Si el endTime es menor que startMinutes, cruza medianoche**
                        if (endMinutes < startMinutes) {
                            endMinutes += 24 * 60;
                        }

                        // **NUEVO: Si el programa NO es del día siguiente pero su endTime sí**
                        if (!program.isNextDay && endMinutes > 24 * 60) {
                            // Esto es normal para programas que cruzan medianoche
                        }
                    } else {
                        // Estimar 2 horas si no hay endTime
                        endMinutes = startMinutes + 120;
                    }

                    // Calcular duración
                    let duration = endMinutes - startMinutes;
                    let width = duration * pixelsPerMinute;

                    // Ancho mínimo
                    width = Math.max(width, 80);

                    // Verificar si el programa es visible en la ventana actual
                    const timelineStartMinutes = timelineStartHour * 60;
                    const timelineEndMinutes = timelineStartMinutes + (hoursToShow * 60);

                    let programStart = startMinutes;
                    let programEnd = endMinutes;

                    // Ajustar para programas del día siguiente
                    if (program.isNextDay) {
                        programStart += (24 * 60);
                        programEnd += (24 * 60);
                    }

                    // Verificar visibilidad
                    const isVisible = programEnd > timelineStartMinutes && programStart < timelineEndMinutes;

                    if (isVisible) {
                        // Ajustar si el programa empieza antes de la ventana visible
                        if (programStart < timelineStartMinutes) {
                            const hiddenMinutes = timelineStartMinutes - programStart;
                            left = 0;
                            width = (duration - hiddenMinutes) * pixelsPerMinute;
                        }

                        const isLive = isNowPlaying(startMinutes, endMinutes, program.isNextDay);
                        const currentMinutes = getCurrentTimeInMinutes();
                        const isPast = endMinutes < currentMinutes && !program.isNextDay;

                        const liveClass = isLive ? 'live' : '';
                        const pastClass = isPast ? 'past' : '';

                        const endHourDisplay = Math.floor(endMinutes / 60) % 24;
                        const endMinDisplay = endMinutes % 60;

                        html += `<div class="program-block ${liveClass} ${pastClass}" style="left: ${left}px; width: ${width}px" title="${program.title}">
                                    <div class="program-title">${program.title}</div>
                                    <div class="program-time-range">${program.time} - ${endHourDisplay.toString().padStart(2, '0')}:${endMinDisplay.toString().padStart(2, '0')}</div>
                                </div>`;
                    }
                });

                html += '</div></div>';
            });

            html += '</div>';

            const currentMinutes = getCurrentTimeInMinutes();
            const currentPosition = minutesToPixels(currentMinutes);

            if (currentPosition >= 0 && currentPosition <= timelineWidth) {
                const now = new Date();
                const argTime = new Date(now.toLocaleString('en-US', { timeZone: 'America/Argentina/Buenos_Aires' }));
                const timeLabel = argTime.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });

                const channelColumnWidth = window.innerWidth <= 768 ? 100 : 150;

                html += `<div class="live-indicator" style="left: ${currentPosition + channelColumnWidth}px">
                    <div class="live-time-label">${timeLabel}</div>
                </div>`;
            }

            html += '</div>';
            content.innerHTML = html;
        }

        function scrollToNow() {
            const currentMinutes = getCurrentTimeInMinutes();
            const currentPosition = minutesToPixels(currentMinutes);
            const container = document.querySelector('.timeline-container');
            if (container) {
                container.scrollLeft = Math.max(0, currentPosition - 200);
            }
        }

        function changeTimeRange(hours) {

            if (container) {
                const currentScroll = container.scrollLeft;
                container.scrollLeft = currentScroll + (hours * 60 * pixelsPerMinute);
            }
        }

        function parseChannelsFromDoc(doc) {
            const channels = [];
            const channelBlocks = doc.querySelectorAll('li.chrow');

            channelBlocks.forEach(block => {
                const channelNumEl = block.querySelector('.chnumheader');
                const channelNameEl = block.querySelector('.chname');

                if (!channelNumEl || !channelNameEl) return;

                const channelNumber = channelNumEl.textContent.trim();
                const channelName = channelNameEl.textContent.trim();

                // Extraer el logo del canal
                let channelLogo = null;
                const logoWrapper = block.querySelector('.logowrapper');
                if (logoWrapper) {
                    const bgImage = logoWrapper.style.backgroundImage;
                    if (bgImage) {
                        const match = bgImage.match(/url\(['"]?([^'"]+)['"]?\)/);
                        if (match && match[1]) {
                            channelLogo = match[1].startsWith('http')
                                ? match[1]
                                : 'https://www.telered.com.ar/' + match[1];
                        }
                    }
                }

                const programs = [];
                const programElements = block.querySelectorAll('li.program.bloque');

                programElements.forEach((progEl, index) => {
                    const titleEl = progEl.querySelector('.programtitle');
                    const timeEl = progEl.querySelector('.programtime');

                    if (titleEl && timeEl) {
                        const title = titleEl.textContent.trim();
                        const time = timeEl.textContent.trim();

                        const nextProgEl = programElements[index + 1];
                        let endTime = null;

                        if (nextProgEl) {
                            const nextTimeEl = nextProgEl.querySelector('.programtime');
                            if (nextTimeEl) {
                                endTime = nextTimeEl.textContent.trim();
                            }
                        }

                        if (!endTime) {
                            const startTime = parseTime(time);
                            if (startTime) {
                                if (startTime.hours >= 20) {
                                    endTime = "00:00";
                                } else {
                                    const endHours = (startTime.hours + 2) % 24;
                                    endTime = `${endHours.toString().padStart(2, '0')}:${startTime.minutes.toString().padStart(2, '0')}`;
                                }
                            }
                        }

                        programs.push({ title, time, endTime });
                    }
                });

                if (programs.length > 0) {
                    channels.push({
                        number: channelNumber,
                        name: channelName,
                        logo: channelLogo,
                        programs: programs
                    });
                }
            });

            return channels;
        }

        function parseAndCombineSchedule(htmlToday, htmlTomorrow) {
            const parser = new DOMParser();

            // Parsear HOY
            const docToday = parser.parseFromString(htmlToday, 'text/html');
            const channelsToday = parseChannelsFromDoc(docToday);

            // Parsear MAÑANA
            const docTomorrow = parser.parseFromString(htmlTomorrow, 'text/html');
            const channelsTomorrow = parseChannelsFromDoc(docTomorrow);

            // **Obtener la hora actual**
            const now = new Date();
            const argTime = new Date(now.toLocaleString('en-US', { timeZone: 'America/Argentina/Buenos_Aires' }));
            const currentHour = argTime.getHours();
            const currentMinutes = argTime.getMinutes();
            const currentTotalMinutes = currentHour * 60 + currentMinutes;

            // Combinar programaciones
            allChannels = [];

            channelsToday.forEach(channelToday => {
                // Buscar el mismo canal en la programación de mañana
                const channelTomorrow = channelsTomorrow.find(ch =>
                    ch.name.toLowerCase().trim() === channelToday.name.toLowerCase().trim()
                );

                let finalPrograms = [];

                // **PASO 1: Agregar todos los programas de HOY (sin filtrar todavía)**
                channelToday.programs.forEach((prog, index) => {
                    const startTime = parseTime(prog.time);
                    if (!startTime) return;

                    const startMinutes = startTime.hours * 60 + startTime.minutes;

                    // Calcular fin del programa
                    let endMinutes;
                    let calculatedEndTime = null;

                    if (prog.endTime) {
                        const endTime = parseTime(prog.endTime);
                        if (endTime) {
                            endMinutes = endTime.hours * 60 + endTime.minutes;
                            calculatedEndTime = prog.endTime;
                            if (endMinutes < startMinutes) {
                                endMinutes += 24 * 60;
                            }
                        }
                    } else if (index < channelToday.programs.length - 1) {
                        // Hay un siguiente programa HOY
                        const nextTime = parseTime(channelToday.programs[index + 1].time);
                        if (nextTime) {
                            endMinutes = nextTime.hours * 60 + nextTime.minutes;
                            calculatedEndTime = channelToday.programs[index + 1].time;
                            if (endMinutes < startMinutes) {
                                endMinutes += 24 * 60;
                            }
                        }
                    } else {
                        // Es el último programa, dejar sin endTime por ahora
                        endMinutes = startMinutes + 120;
                    }

                    // **Mostrar solo programas que NO hayan terminado completamente**
                    const programEnded = endMinutes < currentTotalMinutes && startMinutes < currentTotalMinutes;

                    if (!programEnded) {
                        finalPrograms.push({
                            title: prog.title,
                            time: prog.time,
                            endTime: calculatedEndTime || prog.endTime,
                            isNextDay: false
                        });
                    }
                });

                // **PASO 2: AHORA verificar si el último cruza medianoche**
                if (channelTomorrow && finalPrograms.length > 0) {
                    const lastProgramToday = finalPrograms[finalPrograms.length - 1];
                    const firstProgramTomorrow = channelTomorrow.programs[0];

                    // Verificar si es el mismo programa (cruza medianoche)
                    if (firstProgramTomorrow &&
                        lastProgramToday.title.toLowerCase().trim() === firstProgramTomorrow.title.toLowerCase().trim()) {

                        console.log(`🔗 PROGRAMA QUE CRUZA MEDIANOCHE: ${lastProgramToday.title} en ${channelToday.name}`);

                        // El programa cruza medianoche, actualizar su endTime
                        if (channelTomorrow.programs.length > 1) {
                            // El endTime es cuando empieza el SEGUNDO programa de mañana
                            lastProgramToday.endTime = channelTomorrow.programs[1].time;
                            console.log(`   Fin actualizado a: ${channelTomorrow.programs[1].time}`);
                        }

                        // Agregar el resto de programas de mañana (desde el índice 1, saltando el duplicado)
                        for (let i = 1; i < channelTomorrow.programs.length; i++) {
                            const prog = channelTomorrow.programs[i];
                            finalPrograms.push({
                                title: prog.title,
                                time: prog.time,
                                endTime: prog.endTime,
                                isNextDay: true
                            });
                        }
                    } else {
                        // No hay duplicado, agregar TODOS los programas de mañana
                        channelTomorrow.programs.forEach(prog => {
                            finalPrograms.push({
                                title: prog.title,
                                time: prog.time,
                                endTime: prog.endTime,
                                isNextDay: true
                            });
                        });
                    }
                }

                allChannels.push({
                    number: channelToday.number,
                    name: channelToday.name,
                    logo: channelToday.logo,
                    programs: finalPrograms
                });
            });

            // Agregar canales que solo existen en mañana
            channelsTomorrow.forEach(channelTomorrow => {
                const exists = allChannels.find(ch =>
                    ch.name.toLowerCase().trim() === channelTomorrow.name.toLowerCase().trim()
                );

                if (!exists) {
                    const programs = channelTomorrow.programs.map(prog => ({
                        ...prog,
                        isNextDay: true
                    }));

                    allChannels.push({
                        ...channelTomorrow,
                        programs: programs
                    });
                }
            });

            allChannels = removeDuplicateChannels(allChannels);
            allChannels = sortChannelsByCategory(allChannels);

            window.originalChannels = [...allChannels];

            renderTimeline();
            scrollToNow();
        }

        function categorizeChannel(name) {
            const lowerName = name.toLowerCase();

            if (lowerName.includes('tn hd') || lowerName.includes('c5n') ||
                lowerName.includes('a24') || lowerName.includes('ln+') ||
                lowerName.includes('crónica') || lowerName.includes('cronica') ||
                lowerName.includes('cnn') || lowerName.includes('el trece hd') ||
                lowerName.includes('america hd') || lowerName.includes('el trece hd') ||
                lowerName.includes('tv pública hd') || lowerName.includes('canal provincial') ||
                lowerName.includes('canal 26') || lowerName.includes('c26') || lowerName.includes('telefe')) {
                return 'news';
            }

            if (lowerName.includes('espn') || lowerName.includes('fox sports') ||
                lowerName.includes('tyc') || lowerName.includes('deportv') ||
                lowerName.includes('golf') || lowerName.includes('deporte')) {
                return 'sports';
            }

            if (lowerName.includes('hbo') || lowerName.includes('cinemax') ||
                lowerName.includes('tnt') || lowerName.includes('space') ||
                lowerName.includes('axn') || lowerName.includes('fox') ||
                lowerName.includes('sony') || lowerName.includes('warner') ||
                lowerName.includes('fx') || lowerName.includes('paramount') ||
                lowerName.includes('universal') || lowerName.includes('studio')) {
                return 'movies';
            }

            if (lowerName.includes('nick') || lowerName.includes('disney') ||
                lowerName.includes('cartoon') || lowerName.includes('discovery kids') ||
                lowerName.includes('baby') || lowerName.includes('pakapaka')) {
                return 'kids';
            }

            return 'entertainment';
        }

                'movies': 3,
                'kids': 4,

            };

        function sortChannelsByCategory(channels) {
            // Obtener el orden de CHANNEL_LINKS
            const channelLinksOrder = Object.keys(CHANNEL_LINKS);

            return channels.sort((a, b) => {
                // Buscar el índice en CHANNEL_LINKS
                const indexA = channelLinksOrder.findIndex(key =>
                    key.toLowerCase() === a.name.toLowerCase() ||
                    a.name.toLowerCase().includes(key.toLowerCase()) ||
                    key.toLowerCase().includes(a.name.toLowerCase())
                );

                const indexB = channelLinksOrder.findIndex(key =>
                    key.toLowerCase() === b.name.toLowerCase() ||
                    b.name.toLowerCase().includes(key.toLowerCase()) ||
                    key.toLowerCase().includes(b.name.toLowerCase())
                );

                // Si ambos están en CHANNEL_LINKS, ordenar por su posición
                if (indexA !== -1 && indexB !== -1) {
                    return indexA - indexB;
                }

                // Si solo A está en CHANNEL_LINKS, A va primero
                if (indexA !== -1 && indexB === -1) {
                    return -1;
                }

                // Si solo B está en CHANNEL_LINKS, B va primero
                if (indexA === -1 && indexB !== -1) {
                    return 1;
                }

                // Si ninguno está en CHANNEL_LINKS, ordenar alfabéticamente
                return a.name.localeCompare(b.name);
            });
        }

                        const timeEl = progEl.querySelector('.programtime');
                        if (titleEl && timeEl) {
                            console.log(`${timeEl.textContent.trim()} - ${titleEl.textContent.trim()}`);
                        }
                    });
                }
            });
        }

        // Llamar al debug
        debugAPI();

        function filterChannels() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const channelFilter = document.getElementById('channelFilter').value;

            if (!window.originalChannels) {
                window.originalChannels = [...allChannels];
            }

            allChannels = [...window.originalChannels];

            allChannels = allChannels.filter(channel => {
                if (shouldHideChannel(channel.name)) {
                    return false;
                }

                const matchesSearch = channel.name.toLowerCase().includes(searchTerm) ||
                    channel.programs.some(p => p.title.toLowerCase().includes(searchTerm));
                const matchesCategory = channelFilter === 'all' || categorizeChannel(channel.name) === channelFilter;
                return matchesSearch && matchesCategory;
            });

            allChannels = sortChannelsByCategory(allChannels);

            renderTimeline();
        }

        setInterval(() => {
            updateCurrentTime();
            renderTimeline();
        }, 60000);

        updateCurrentTime();
        renderTimeline();
        setInterval(updateCurrentTime, 1000);

        loadSchedule();


        function ajustarAltura() {
            const altura =
                document.documentElement.scrollHeight ||
                document.body.scrollHeight;

            window.parent.postMessage(
                { tipo: 'ajustar-iframe', altura },
                '*'
            );
        }

        window.addEventListener('load', ajustarAltura);
        window.addEventListener('resize', ajustarAltura);

        // Si el contenido cambia dinámicamente
        const observer = new MutationObserver(ajustarAltura);
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });


        document.addEventListener('contextmenu', function (e) {
            e.preventDefault();
        });
    </script>
