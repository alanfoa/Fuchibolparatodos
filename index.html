<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuchibolparatodos</title>

    <!-- Favicon -->
    <link rel="shortcut icon" href="assets/favicon.png" type="image/png">

    <!-- CSS -->
    <link rel="stylesheet" href="bootstrap-5.3.3-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style-pro2.css">
</head>

<body id="contenido" class="">
    <!-- Animated background particles -->
    <div class="bg-particles"></div>

    <!-- Snowflakes container -->
    <div id="snowflakes-container"></div>

    <!-- Navigation -->
    <nav id="id_nav" class="bg-dark bg-gradient p-0 container-fluid"
        style="display:flex;align-items:center;justify-content:center;min-height:42px;position:relative;z-index:20">
        <a href="/" title="Fuchibolparatodos"
            style="position:absolute;left:8px;top:50%;transform:translateY(-50%);line-height:0">
            <img src="assets/logo-nav.png" alt="Fuchibolparatodos" height="32">
        </a>
        <ul class="list-unstyled d-flex align-items-center gap-1 mb-0" style="margin:0;padding:0">
            <li><a class='btn btn-secondary px-3 bi bi-tv-fill active' data-bs-placement='bottom' data-bs-toggle='tooltip' href='/' id='Inicio' title='Canales de TV'> TV Online</a></li>
            <li><a class='btn btn-secondary px-3 bi bi-grid-fill' data-bs-placement='bottom' data-bs-toggle='tooltip' href='/html/guia.html' title='Guía de Programación'></a></li>
            <li><a class='btn btn-secondary px-3 bi bi-film' data-bs-placement='bottom' data-bs-toggle='tooltip' href='/html/cineplay.html' title='CinePlay'></a></li>
        </ul>
        <div style="position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:4px">
            <a id="id_sapping-canal" class="btn btn-secondary" title="Reiniciar Canal"
                data-bs-toggle="tooltip" data-bs-placement="bottom" style="display:none;white-space:nowrap"></a>
            <select id="id_optCanales" class="btn btn-outline-secondary border border-dark rounded text-light p-0"
                title="⚙️ Servidores" style="display:none" data-bs-toggle="tooltip" data-bs-placement="bottom">
            </select>
            <a id="id_sapping-izquierda" class="btn btn-secondary bi bi-arrow-left-circle text-light px-3"
                data-bs-toggle="tooltip" data-bs-placement="bottom" title="Anterior (Alt+◄)"></a>
            <a id="id_sapping-derecha" class="btn btn-secondary bi bi-arrow-right-circle text-light px-3"
                data-bs-toggle="tooltip" data-bs-placement="bottom" title="Siguiente (Alt+►)"></a>
        </div>
    </nav>

    <!-- Main content -->
    <main id="menu_canales" class="col-12 text-center">
        <!-- Video player -->
        <iframe id="id_PantallaTV" class="col-12 mb-4 Class_PantallaTV" src="" title="" frameborder="0" scrolling="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen="true" marginheight="0" marginwidth="0"
            webkitallowfullscreen="true" mozallowfullscreen="true" msExitFullscreen="true"></iframe>

        <div id="infoEnVivo"></div>

        <!-- Notification container -->
        <div id="notification-container"></div>

        <!-- Search section -->
        <section id="id_barra_buscador" class="m-3 mt-0 pt-3 d-flex btn-group dropdown-center">
            <input id="id_BuscardorCanales" class="form-control form-control-lg text-center"
                title="Buscar canales (Alt + F)" type="search" placeholder="🔍 Buscar canales...">
            <button id="id_categoria" type="button"
                class="btn btn-outline-secondary border border-light text-light p-2 px-3 bg-dark bg-gradient bi bi-ui-checks-grid"
                data-bs-toggle="modal" data-bs-target="#canalesModal" title="Filtrar por categoría"></button>
            <select id="id_optPais"
                class="btn btn-outline-secondary border border-light text-light p-0 bg-dark bg-gradient"
                title="Filtrar por país"></select>
        </section>

        <!-- Loading message -->
        <p id="id_mensaje" class="d-none text-center text-light fs-2 loading-pulse">⚡ Cargando canales mágicos...</p>

        <!-- NoScript message -->
        <noscript>
            <div class="noscript-alert" role="alert" aria-live="polite">
                <h5>⚠️ JavaScript está desactivado</h5>
                <p>Esta página necesita JavaScript para funcionar correctamente. Por favor, actívalo en tu navegador.
                </p>
            </div>
        </noscript>

        <!-- Channels section -->
        <section id="id_CanalesDisponibles" class="pt-3 mb-5 d-flex flex-wrap justify-content-evenly"></section>

        <!-- Context menu -->
        <ul class="submenu" id="submenu">
            <li id="abrirOtraVentana">Abrir en nueva ventana</li>
        </ul>
    </main>

    <!-- Categories Modal -->
    <section class="modal fade" id="canalesModal" tabindex="-1" aria-labelledby="canalesModalLabel" aria-hidden="true">
        <section class="modal-dialog">
            <section class="modal-content bg-dark text-white">
                <header class="modal-header">
                    <h5 class="modal-title" id="canalesModalLabel">📺 Selecciona un tipo de canal</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Cerrar"></button>
                </header>
                <main class="modal-body">
                    <section class="container text-center">
                        <section id="botonesCategorias" class="row g-3"></section>
                    </section>
                </main>
            </section>
        </section>
    </section>

    <!-- Back to top button -->
    <button id="backToTop">
        <i class="bi bi-arrow-up"></i>
    </button>



    <!-- Scripts -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="js/script-ch.js"></script>
    <script src="js/script-canalespro.js"></script>
    <script src="js/script-config.js"></script>
    <script src="bootstrap-5.3.3-dist/js/bootstrap.bundle.min.js" type="text/javascript"></script>
</body>

</html>
